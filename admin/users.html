<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة المستخدمين والصلاحيات</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/admin-users-access.css?v=20260815-01" />
  <script src="../js/notifications.js?v=20260901-global-01"></script>
</head>
<body>
<script src="../js/api.js"></script>
<script src="../js/layout.js?v=20260815-01"></script>

<script>
renderLayout(
  "إدارة المستخدمين والصلاحيات",
  "اختر المستخدم وحدد الشركات والفروع والتقارير التي تظهر له",
  "admin-users",
  `
    <div class="user-access-page">
      <section class="admin-users-hero access-hero">
        <div>
          <span class="access-hero-kicker">Access Control</span>
          <h3>مركز المستخدمين والصلاحيات</h3>
          <p>كل مستخدم يرى فقط التقارير المحددة له، وتبقى صفحات الإدارة محجوزة للأدمن.</p>
        </div>

        <div class="admin-user-stats">
          <div><strong id="totalUsers">0</strong><span>مستخدم</span></div>
          <div><strong id="activeUsers">0</strong><span>نشط</span></div>
          <div><strong id="disabledUsers">0</strong><span>موقوف</span></div>
        </div>
      </section>

      <section class="user-access-workspace">
        <aside class="panel user-directory-panel">
          <div class="directory-head">
            <div>
              <span class="section-kicker">Users</span>
              <h3>المستخدمون</h3>
              <p>اختر مستخدمًا لتعديل صلاحياته.</p>
            </div>
            <button class="primary-btn compact-action" type="button" onclick="startNewUser()">+ مستخدم جديد</button>
          </div>

          <label class="user-search-field">
            <span>بحث</span>
            <input id="usersSearch" type="search" placeholder="الاسم أو اسم المستخدم" oninput="renderUsers()" />
          </label>

          <div id="usersCards" class="users-directory-list"></div>
        </aside>

        <section class="panel user-editor-panel">
          <div id="userEditorEmpty" class="user-editor-empty">
            <span class="empty-editor-icon">✓</span>
            <h3>اختر مستخدمًا من القائمة</h3>
            <p>ستظهر بياناته وكل تقارير المشروع هنا لتحديد المسموح له.</p>
            <button class="primary-btn" type="button" onclick="startNewUser()">إنشاء مستخدم جديد</button>
          </div>

          <div id="userEditorContent" class="hidden">
            <header class="editor-head">
              <div>
                <span id="editorModeBadge" class="editor-mode-badge">مستخدم جديد</span>
                <h3 id="formTitle">إضافة مستخدم جديد</h3>
                <p id="editorSubtitle">أدخل بيانات المستخدم ثم حدد نطاق البيانات والتقارير.</p>
              </div>

              <div class="editor-head-actions">
                <button id="deleteUserBtn" class="danger-outline-btn hidden" type="button" onclick="deleteSelectedUser()">حذف المستخدم</button>
                <button class="secondary-action-btn" type="button" onclick="closeEditor()">إغلاق</button>
              </div>
            </header>

            <div id="adminAccessNotice" class="admin-access-notice hidden">
              هذا حساب Admin؛ يمتلك جميع الشركات والفروع والتقارير تلقائيًا ولا يحتاج صلاحيات يدوية.
            </div>

            <section class="access-section identity-section">
              <div class="access-section-head">
                <div>
                  <span class="section-number">01</span>
                  <h4>بيانات المستخدم</h4>
                  <p>البيانات الأساسية المستخدمة في تسجيل الدخول.</p>
                </div>
              </div>

              <div class="user-form-grid access-user-form">
                <input id="userId" type="hidden" />
                <label>
                  <span>اسم المستخدم</span>
                  <input id="username" autocomplete="off" placeholder="اسم المستخدم" />
                </label>
                <label>
                  <span>الاسم الكامل</span>
                  <input id="fullName" autocomplete="off" placeholder="الاسم الكامل" />
                </label>
                <label>
                  <span>كلمة المرور</span>
                  <input id="password" type="password" autocomplete="new-password" placeholder="كلمة المرور" />
                </label>
              </div>
            </section>

            <section class="access-section" data-access-control-section>
              <div class="access-section-head">
                <div>
                  <span class="section-number">02</span>
                  <h4>الشركات المسموحة</h4>
                  <p>اختر الشركات التي يمكن للمستخدم قراءة بياناتها.</p>
                </div>
              </div>
              <div id="companiesCheckboxes" class="company-access-grid"></div>
            </section>

            <section class="access-section" data-access-control-section>
              <div class="access-section-head">
                <div>
                  <span class="section-number">03</span>
                  <h4>الفروع المسموحة</h4>
                  <p>الفروع المختارة تطبق على التقارير التي تعمل بنطاق الشركة والفرع.</p>
                </div>
              </div>
              <div id="posBranchesCheckboxes" class="branch-access-stack"></div>
            </section>

            <section class="access-section reports-access-section" data-access-control-section>
              <div class="report-access-heading access-section-head">
                <div>
                  <span class="section-number">04</span>
                  <h4>تقارير المشروع المسموحة</h4>
                  <p>الأقسام والتقارير كلها أمامك؛ المحدد فقط سيظهر للمستخدم داخل الصفحة الرئيسية والقائمة.</p>
                </div>

                <div class="report-access-actions">
                  <span class="selected-permissions-count"><strong id="selectedReportsCount">0</strong> تقرير محدد</span>
                  <button type="button" class="secondary-action-btn" onclick="setAllDirectReports(true)">تحديد الكل</button>
                  <button type="button" class="secondary-action-btn" onclick="setAllDirectReports(false)">إلغاء الكل</button>
                </div>
              </div>

              <div id="directReportsArea" class="project-permissions-stack"></div>
            </section>

            <footer class="editor-save-bar">
              <div>
                <strong>راجع الاختيارات قبل الحفظ</strong>
                <span>أي تقرير غير محدد لن يظهر للمستخدم.</span>
              </div>
              <div class="editor-save-actions">
                <button class="secondary-action-btn" type="button" onclick="resetEditorValues()">إعادة ضبط</button>
                <button id="saveUserBtn" class="primary-btn" type="button" onclick="saveUser()">حفظ المستخدم والصلاحيات</button>
              </div>
            </footer>
          </div>
        </section>
      </section>
    </div>
  `
);

let users = [];
let companyCatalog = [];
let posBranchCatalogByCompany = {};
let reportCatalog = [];
let selectedUserId = null;
let selectedUserSnapshot = null;

const REPORT_MODULE_ICONS = {
  Branches: "🏬",
  Menu: "📋",
  POS: "🧾",
  Customers: "👥",
  "Customer Reviews": "💬",
  Purchase: "📦",
  Inventory: "🏷️",
  Production: "🏭",
  Costing: "💰",
  Forecast: "🎯",
  Sales: "📈",
  Alerts: "🔔",
  "Forecast Planning": "📊"
};

const UNAVAILABLE_REPORT_CODES = new Set([
  "branches.comparison",
  "pos.branches",
  "sales.daily",
  "sales.report"
]);

const REPORT_PERMISSION_PARENTS = {
  "branches.manage": "branches.overview",
  "customer.review_sms.manage_followups": "customer.review_sms.followup",
  "costing.settings": "costing.overview",
  "alerts.manage": "alerts.view"
};

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function localText(arabic, english) {
  return window.MI18n?.getLanguage?.() === "en" ? english : arabic;
}

function getStoredUser() {
  try {
    return JSON.parse(localStorage.getItem("user") || "{}");
  } catch (_) {
    return {};
  }
}

function isAdminAccount(user = {}) {
  return ["admin", "super_admin"].includes(String(user.role || "").toLowerCase()) ||
    ["admin", "super_admin"].includes(String(user.role_code || "").toLowerCase());
}

function showEditor() {
  document.getElementById("userEditorEmpty")?.classList.add("hidden");
  document.getElementById("userEditorContent")?.classList.remove("hidden");
}

function closeEditor() {
  selectedUserId = null;
  selectedUserSnapshot = null;
  document.getElementById("userEditorContent")?.classList.add("hidden");
  document.getElementById("userEditorEmpty")?.classList.remove("hidden");
  renderUsers();
}

async function loadUsers() {
  const response = await apiGet("/users");
  users = response.data || [];

  document.getElementById("totalUsers").innerText = users.length;
  document.getElementById("activeUsers").innerText = users.filter(user => user.is_active).length;
  document.getElementById("disabledUsers").innerText = users.filter(user => !user.is_active).length;
  renderUsers();
}

function renderUsers() {
  const container = document.getElementById("usersCards");
  if (!container) return;

  const query = String(document.getElementById("usersSearch")?.value || "").trim().toLowerCase();
  const filtered = users.filter(user => {
    const haystack = `${user.full_name || ""} ${user.username || ""}`.toLowerCase();
    return !query || haystack.includes(query);
  });

  if (!filtered.length) {
    container.innerHTML = `<div class="directory-empty">لا يوجد مستخدمون مطابقون للبحث.</div>`;
    return;
  }

  const currentUserId = Number(getStoredUser().id);
  container.innerHTML = filtered.map(user => {
    const active = Boolean(user.is_active);
    const selected = Number(user.id) === Number(selectedUserId);
    const admin = isAdminAccount(user);
    const canDelete = Number(user.id) !== currentUserId;

    return `
      <article class="directory-user-card ${active ? "" : "disabled-user"} ${selected ? "selected" : ""}">
        <button class="user-select-area" type="button" onclick="selectUser(${Number(user.id)})">
          <span class="user-avatar">${escapeHtml((user.full_name || user.username || "?").slice(0, 1).toUpperCase())}</span>
          <span class="directory-user-copy">
            <strong>${escapeHtml(user.full_name || user.username || "-")}</strong>
            <small>@${escapeHtml(user.username || "-")}</small>
            <span class="user-state-row">
              <i class="status-dot ${active ? "active" : "inactive"}"></i>
              ${active ? "نشط" : "موقوف"}
              ${admin ? '<b class="admin-mini-badge">Admin</b>' : ""}
            </span>
          </span>
          <span class="select-user-arrow">‹</span>
        </button>

        <div class="directory-user-actions">
          <button type="button" onclick="changePassword(${Number(user.id)})">كلمة المرور</button>
          <button type="button" onclick="toggleUser(${Number(user.id)}, ${active})">${active ? "تعطيل" : "تفعيل"}</button>
          ${canDelete ? `<button class="danger-text-action" type="button" onclick="deleteUser(${Number(user.id)})">حذف</button>` : ""}
        </div>
      </article>
    `;
  }).join("");
}

async function loadCompanyCatalog() {
  const response = await apiGet("/company-access/catalog");
  companyCatalog = response.data || [];
  document.getElementById("companiesCheckboxes").innerHTML = companyCatalog.map(company => `
    <label class="access-check-card">
      <input type="checkbox" class="company-check" value="${Number(company.companyId)}" onchange="syncCompanyBranchAvailability()" />
      <span class="access-check-indicator"></span>
      <span><strong>${escapeHtml(company.companyName)}</strong><small>السماح ببيانات الشركة</small></span>
    </label>
  `).join("");
}

function getSelectedCompanyIds() {
  return Array.from(document.querySelectorAll(".company-check:checked")).map(input => Number(input.value));
}

function setSelectedCompanyIds(companyIds = []) {
  const allowed = new Set(companyIds.map(Number));
  document.querySelectorAll(".company-check").forEach(input => {
    input.checked = allowed.has(Number(input.value));
  });
}

async function loadDirectReportsCatalog() {
  const response = await apiGet("/permissions/catalog");
  reportCatalog = (response.data || [])
    .filter(report => report.module !== "Administration")
    .filter(report => report.code !== "dashboard.index")
    .filter(report => !UNAVAILABLE_REPORT_CODES.has(report.code));
  renderDirectReports();
}

function groupReportsByModule() {
  const modules = new Map();
  reportCatalog.forEach(report => {
    if (!modules.has(report.module)) {
      modules.set(report.module, {
        code: report.module,
        label: report.moduleLabel || report.module,
        order: Number(report.order || 999),
        reports: []
      });
    }
    modules.get(report.module).reports.push(report);
  });

  return Array.from(modules.values())
    .sort((a, b) => a.order - b.order)
    .map(module => ({
      ...module,
      reports: module.reports.sort((a, b) => Number(a.order || 999) - Number(b.order || 999))
    }));
}

function renderDirectReports() {
  const container = document.getElementById("directReportsArea");
  if (!container) return;

  container.innerHTML = groupReportsByModule().map(module => `
    <section class="project-permission-module" data-report-module-block="${escapeHtml(module.code)}">
      <header class="project-permission-module-head">
        <label class="module-master-toggle">
          <input type="checkbox" onchange="toggleReportModule('${escapeHtml(module.code)}', this.checked)" />
          <span class="module-icon">${REPORT_MODULE_ICONS[module.code] || "📄"}</span>
          <span><strong>${escapeHtml(module.label)}</strong><small>${localText(`${module.reports.length} تقرير`, `${module.reports.length} reports`)}</small></span>
        </label>
        <button type="button" onclick="toggleReportModule('${escapeHtml(module.code)}', true)">تحديد القسم</button>
      </header>

      <div class="module-report-rows">
        ${module.reports.map(report => `
          <label class="report-access-row ${REPORT_PERMISSION_PARENTS[report.code] ? "permission-child" : ""}">
            <input type="checkbox" class="direct-report-check"
              data-report-module="${escapeHtml(module.code)}"
              data-report-scope="${escapeHtml(report.scope)}"
              data-permission-parent="${escapeHtml(REPORT_PERMISSION_PARENTS[report.code] || "")}"
              value="${escapeHtml(report.code)}"
              onchange="handleReportPermissionChange(this)" />
            <span class="report-checkbox-visual"></span>
            <span class="report-access-copy">
              <strong>${escapeHtml(report.label)}</strong>
              <small>${escapeHtml(report.scopeLabel || "شركة فقط")}</small>
            </span>
            <code>${escapeHtml(report.code)}</code>
          </label>
        `).join("")}
      </div>
    </section>
  `).join("");
  syncPermissionSummary();
}

function getSelectedDirectReports() {
  return Array.from(document.querySelectorAll(".direct-report-check:checked")).map(input => input.value);
}

function setSelectedDirectReports(codes = []) {
  const allowed = new Set(codes);
  document.querySelectorAll(".direct-report-check").forEach(input => {
    input.checked = allowed.has(input.value);
  });
  syncPermissionDependencies();
  syncPermissionSummary();
}

function setAllDirectReports(checked) {
  document.querySelectorAll(".direct-report-check:not(:disabled)").forEach(input => { input.checked = checked; });
  syncPermissionSummary();
}

function toggleReportModule(moduleCode, checked) {
  document.querySelectorAll(`.direct-report-check[data-report-module="${CSS.escape(moduleCode)}"]:not(:disabled)`)
    .forEach(input => { input.checked = checked; });
  syncPermissionSummary();
}

function syncPermissionDependencies() {
  document.querySelectorAll('.direct-report-check[data-permission-parent]:checked').forEach(input => {
    const parentCode = input.dataset.permissionParent;
    if (!parentCode) return;
    const parent = document.querySelector(`.direct-report-check[value="${CSS.escape(parentCode)}"]`);
    if (parent) parent.checked = true;
  });
}

function handleReportPermissionChange(input) {
  const parentCode = input.dataset.permissionParent;
  if (input.checked && parentCode) {
    const parent = document.querySelector(`.direct-report-check[value="${CSS.escape(parentCode)}"]`);
    if (parent) parent.checked = true;
  }

  if (!input.checked) {
    document.querySelectorAll(`.direct-report-check[data-permission-parent="${CSS.escape(input.value)}"]`)
      .forEach(child => { child.checked = false; });
  }

  syncPermissionSummary();
}

function syncPermissionSummary() {
  const checkedCount = document.querySelectorAll(".direct-report-check:checked").length;
  const counter = document.getElementById("selectedReportsCount");
  if (counter) counter.textContent = String(checkedCount);

  document.querySelectorAll("[data-report-module-block]").forEach(block => {
    const boxes = Array.from(block.querySelectorAll(".direct-report-check"));
    const toggle = block.querySelector(".module-master-toggle input");
    if (!toggle) return;
    const selected = boxes.filter(box => box.checked).length;
    toggle.checked = boxes.length > 0 && selected === boxes.length;
    toggle.indeterminate = selected > 0 && selected < boxes.length;
  });
}

async function loadPosBranchCatalog() {
  posBranchCatalogByCompany = {};
  for (const company of companyCatalog) {
    const response = await apiGet("/pos-branch-access/catalog", { companyId: company.companyId });
    posBranchCatalogByCompany[company.companyId] = response.data || [];
  }
  renderPosBranchCheckboxes();
}

function renderPosBranchCheckboxes() {
  const container = document.getElementById("posBranchesCheckboxes");
  if (!container) return;

  container.innerHTML = companyCatalog.map(company => {
    const branches = posBranchCatalogByCompany[company.companyId] || [];
    return `
      <section class="branch-company-block" data-branch-company-block="${Number(company.companyId)}">
        <header>
          <div><strong>${escapeHtml(company.companyName)}</strong><small>${localText(`${branches.length} فرع متاح`, `${branches.length} available branches`)}</small></div>
          <button type="button" onclick="toggleCompanyBranches(${Number(company.companyId)}, true)">كل الفروع</button>
        </header>
        <div class="branch-check-grid">
          ${branches.length ? branches.map(branch => `
            <label class="compact-check-row">
              <input type="checkbox" class="pos-branch-check"
                data-company-id="${Number(company.companyId)}"
                value="${escapeHtml(branch.branchCode)}" />
              <span>${escapeHtml(branch.branchName)}</span>
            </label>
          `).join("") : '<p class="muted-text">لا توجد فروع POS لهذه الشركة.</p>'}
        </div>
      </section>
    `;
  }).join("");
  syncCompanyBranchAvailability();
}

function toggleCompanyBranches(companyId, checked) {
  document.querySelectorAll(`.pos-branch-check[data-company-id="${Number(companyId)}"]:not(:disabled)`)
    .forEach(input => { input.checked = checked; });
}

function syncCompanyBranchAvailability() {
  const selectedCompanies = new Set(getSelectedCompanyIds());
  document.querySelectorAll("[data-branch-company-block]").forEach(block => {
    const companyId = Number(block.dataset.branchCompanyBlock);
    const enabled = selectedCompanies.has(companyId);
    block.classList.toggle("permission-scope-disabled", !enabled);
    block.querySelectorAll("input, button").forEach(control => {
      control.disabled = !enabled;
      if (!enabled && control.matches("input")) control.checked = false;
    });
  });
}

function findBranchInCatalog(companyId, branchCode) {
  return (posBranchCatalogByCompany[companyId] || []).find(branch =>
    String(branch.branchCode) === String(branchCode)
  );
}

function getSelectedPosBranchesByCompany() {
  const result = {};
  document.querySelectorAll(".pos-branch-check:checked").forEach(input => {
    const companyId = Number(input.dataset.companyId);
    const branch = findBranchInCatalog(companyId, input.value);
    if (!branch) return;
    if (!result[companyId]) result[companyId] = [];
    result[companyId].push({
      branchCode: branch.branchCode,
      branchName: branch.branchName,
      sourceLocationId: branch.sourceLocationId
    });
  });
  return result;
}

function setSelectedPosBranches(rows = []) {
  document.querySelectorAll(".pos-branch-check").forEach(input => {
    const companyId = Number(input.dataset.companyId);
    input.checked = rows.some(row => Number(row.companyId) === companyId && String(row.branchCode) === String(input.value));
  });
}

function clearAccessSelections() {
  setSelectedCompanyIds([]);
  document.querySelectorAll(".pos-branch-check").forEach(input => { input.checked = false; });
  setSelectedDirectReports([]);
  syncCompanyBranchAvailability();
}

function setAccessControlsDisabled(disabled) {
  document.querySelectorAll("[data-access-control-section] input, [data-access-control-section] button")
    .forEach(control => { control.disabled = disabled; });
}

function applyAdminAccessState(admin) {
  document.getElementById("adminAccessNotice")?.classList.toggle("hidden", !admin);
  if (admin) {
    document.querySelectorAll(".company-check, .pos-branch-check, .direct-report-check")
      .forEach(input => { input.checked = true; });
  }
  setAccessControlsDisabled(admin);
  syncPermissionSummary();
}

function startNewUser() {
  selectedUserId = null;
  selectedUserSnapshot = null;
  showEditor();
  document.getElementById("editorModeBadge").textContent = "مستخدم جديد";
  document.getElementById("formTitle").textContent = "إضافة مستخدم جديد";
  document.getElementById("editorSubtitle").textContent = "أدخل بيانات المستخدم ثم حدد نطاق البيانات والتقارير.";
  document.getElementById("deleteUserBtn").classList.add("hidden");
  document.getElementById("userId").value = "";
  document.getElementById("username").value = "";
  document.getElementById("username").disabled = false;
  document.getElementById("fullName").value = "";
  document.getElementById("password").value = "";
  document.getElementById("password").disabled = false;
  document.getElementById("password").placeholder = "كلمة المرور";
  setAccessControlsDisabled(false);
  document.getElementById("adminAccessNotice")?.classList.add("hidden");
  clearAccessSelections();
  renderUsers();
  document.querySelector(".user-editor-panel")?.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function selectUser(id) {
  const user = users.find(item => Number(item.id) === Number(id));
  if (!user) return;

  selectedUserId = Number(id);
  selectedUserSnapshot = user;
  showEditor();
  renderUsers();
  document.getElementById("editorModeBadge").textContent = isAdminAccount(user) ? "Admin" : "تعديل مستخدم";
  document.getElementById("formTitle").textContent = user.full_name || user.username;
  document.getElementById("editorSubtitle").textContent = `@${user.username}`;
  document.getElementById("userId").value = user.id;
  document.getElementById("username").value = user.username;
  document.getElementById("username").disabled = true;
  document.getElementById("fullName").value = user.full_name || "";
  document.getElementById("password").value = "";
  document.getElementById("password").disabled = true;
  document.getElementById("password").placeholder = "استخدم زر تغيير كلمة المرور";

  const currentUserId = Number(getStoredUser().id);
  document.getElementById("deleteUserBtn").classList.toggle("hidden", Number(user.id) === currentUserId);
  setAccessControlsDisabled(false);

  if (isAdminAccount(user)) {
    applyAdminAccessState(true);
  } else {
    applyAdminAccessState(false);
    const [companyResponse, branchResponse, permissionsResponse] = await Promise.all([
      apiGet(`/company-access/users/${id}`),
      apiGet(`/pos-branch-access/users/${id}`),
      apiGet(`/permissions/users/${id}`)
    ]);
    setSelectedCompanyIds((companyResponse.data || []).map(item => Number(item.companyId)));
    syncCompanyBranchAvailability();
    setSelectedPosBranches(branchResponse.data || []);
    setSelectedDirectReports(permissionsResponse.data || []);
  }

  document.querySelector(".user-editor-panel")?.scrollIntoView({ behavior: "smooth", block: "start" });
}

function resetEditorValues() {
  if (selectedUserId) selectUser(selectedUserId);
  else startNewUser();
}

function validateAccessSelection(companyIds, selectedBranchesByCompany) {
  if (!companyIds.length) {
    alert(localText("اختر شركة واحدة على الأقل", "Select at least one company"));
    return false;
  }

  const hasBranchScopedReports = document.querySelector('.direct-report-check[data-report-scope="company_branch"]:checked');
  if (hasBranchScopedReports) {
    const companiesWithoutBranches = companyIds.filter(companyId => !(selectedBranchesByCompany[companyId] || []).length);
    if (companiesWithoutBranches.length) {
      alert(localText(
        "اختر فرعًا واحدًا على الأقل لكل شركة لأن المستخدم لديه تقارير بنطاق الشركة والفرع",
        "Select at least one branch for every company because the user has company-and-branch reports"
      ));
      return false;
    }
  }
  return true;
}

async function saveUser() {
  const id = document.getElementById("userId").value;
  const username = document.getElementById("username").value.trim();
  const fullName = document.getElementById("fullName").value.trim();
  const password = document.getElementById("password").value;
  const selectedUser = id ? users.find(user => Number(user.id) === Number(id)) : null;
  const admin = isAdminAccount(selectedUser || {});

  if (!username || (!id && password.length < 6)) {
    alert(localText(
      "اسم المستخدم وكلمة مرور من 6 أحرف على الأقل مطلوبان",
      "A username and a password of at least 6 characters are required"
    ));
    return;
  }

  const companyIds = getSelectedCompanyIds();
  const selectedBranchesByCompany = getSelectedPosBranchesByCompany();
  const directReports = getSelectedDirectReports();
  if (!admin && !validateAccessSelection(companyIds, selectedBranchesByCompany)) return;

  const saveButton = document.getElementById("saveUserBtn");
  saveButton.disabled = true;

  try {
    let userId = Number(id);
    if (id) {
      const updateResponse = await apiPatch(`/users/${id}`, { fullName, role: admin ? selectedUser.role : "user" });
      if (!updateResponse.success) throw new Error(updateResponse.message || localText("فشل تعديل المستخدم", "Could not update the user"));
    } else {
      const createResponse = await apiPost("/users", { username, fullName, password, role: "user" });
      if (!createResponse.success) throw new Error(createResponse.message || localText("فشل إنشاء المستخدم", "Could not create the user"));
      userId = Number(createResponse.data.id);
    }

    if (!admin) {
      const companiesResponse = await apiPut(`/company-access/users/${userId}`, { companyIds });
      if (!companiesResponse.success) throw new Error(companiesResponse.message || localText("فشل حفظ شركات المستخدم", "Could not save user companies"));

      for (const company of companyCatalog) {
        const companyId = Number(company.companyId);
        const branchResponse = await apiPut(`/pos-branch-access/users/${userId}`, {
          companyId,
          branches: selectedBranchesByCompany[companyId] || []
        });
        if (!branchResponse.success) throw new Error(
          branchResponse.message || localText(`فشل حفظ فروع ${company.companyName}`, `Could not save branches for ${company.companyName}`)
        );
      }

      const permissionsResponse = await apiPut(`/permissions/users/${userId}`, { permissions: directReports });
      if (!permissionsResponse.success) throw new Error(
        permissionsResponse.message || localText("فشل حفظ صلاحيات التقارير", "Could not save report permissions")
      );
    }

    alert(localText("تم حفظ المستخدم والصلاحيات بنجاح", "User and permissions saved successfully"));
    await loadUsers();
    await selectUser(userId);
  } catch (error) {
    alert(error.message || localText("تعذر حفظ المستخدم", "Could not save the user"));
  } finally {
    saveButton.disabled = false;
  }
}

async function changePassword(id) {
  const password = prompt(localText("اكتب كلمة المرور الجديدة للمستخدم:", "Enter the user's new password:"));
  if (!password) return;
  if (password.length < 6) {
    alert(localText("كلمة المرور يجب ألا تقل عن 6 أحرف", "The password must be at least 6 characters"));
    return;
  }
  await apiPatch(`/users/${id}/password`, { password });
  alert(localText("تم تغيير كلمة المرور", "Password changed successfully"));
}

async function toggleUser(id, isActive) {
  try {
    await apiPatch(`/users/${id}`, { isActive: !isActive });
    await loadUsers();
    if (Number(selectedUserId) === Number(id)) await selectUser(id);
  } catch (error) {
    alert(error.message || localText("تعذر تحديث حالة المستخدم", "Could not update the user status"));
  }
}

async function deleteUser(id) {
  const user = users.find(item => Number(item.id) === Number(id));
  if (!user) return;
  if (Number(getStoredUser().id) === Number(id)) {
    alert(localText("لا يمكنك حذف حسابك الحالي", "You cannot delete your current account"));
    return;
  }

  const userLabel = user.full_name || user.username;
  const confirmed = confirm(localText(
    `سيتم حذف المستخدم ${userLabel} وكل صلاحياته. هل تريد المتابعة؟`,
    `User ${userLabel} and all assigned permissions will be deleted. Continue?`
  ));
  if (!confirmed) return;

  try {
    await apiDelete(`/users/${id}`);
    if (Number(selectedUserId) === Number(id)) closeEditor();
    await loadUsers();
    alert(localText("تم حذف المستخدم من النظام", "User deleted from the system"));
  } catch (error) {
    alert(error.message || localText("تعذر حذف المستخدم", "Could not delete the user"));
  }
}

function deleteSelectedUser() {
  if (selectedUserId) deleteUser(selectedUserId);
}

async function init() {
  try {
    await Promise.all([loadCompanyCatalog(), loadDirectReportsCatalog()]);
    await loadPosBranchCatalog();
    await loadUsers();
  } catch (error) {
    console.error(error);
    alert(error.message || localText("تعذر تحميل إدارة المستخدمين", "Could not load user management"));
  }
}

init();
</script>
</body>
</html>
