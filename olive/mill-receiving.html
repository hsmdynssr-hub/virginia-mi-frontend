<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استلام المعاصر والنقلات</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/mi-app.css"><link rel="stylesheet" href="../css/report-ui.css"><link rel="stylesheet" href="../css/bootstrap-theme.css"><link rel="stylesheet" href="./olive-project.css?v=20261012-scroll4"><link rel="stylesheet" href="./mill-reports.css?v=20261013-portal1"></head><body><template id="millTemplate"><div class="mill-report-page"><div class="report-card"><div class="mill-filter"><div><label for="millPeriod">طريقة العرض</label><select id="millPeriod"><option value="ALL">الكل — جميع البيانات</option><option value="CUSTOM">فترة مخصصة</option></select></div><div id="millFromField" hidden><label for="millFrom">من تاريخ</label><input id="millFrom" type="date"></div><div id="millToField" hidden><label for="millTo">إلى تاريخ</label><input id="millTo" type="date"></div><div><label for="millSource">منصة المصدر</label><select id="millSource"><option value="">كل المصادر</option><option value="QASR_MATROUH">القصر — مطروح</option><option value="BARRANI_NEGILA">براني والنجلية</option><option value="DABAA_RAS_EL_HEKMA">الضبعة ورأس الحكمة</option><option value="MAIN">MAIN — مرجع قديم</option></select></div><button class="btn" id="millLoad">عرض التقرير</button></div><p class="mill-small">الكميات حسب صافي البسكول وتاريخ الوصول المسجل، مستقلة عن فواتير الشراء. النقلات الملغاة لا تدخل في المجاميع. طريقة الوصول غير المسجلة قديمًا تظهر «غير محدد».</p></div><div id="millMessage" class="mill-status" role="status"></div><div class="mill-kpis" id="millKpis"></div><section class="report-card"><h2>استلام المعاصر حسب المصدر وطريقة الوصول</h2><div class="mill-table-scroll"><table><thead><tr><th>المعصرة</th><th>منصة المصدر</th><th>طريقة الوصول</th><th>عدد النقلات</th><th>صافي البسكول كجم</th></tr></thead><tbody id="millSourceSummary"></tbody><tfoot id="millSourceTotals"></tfoot></table></div></section><section class="report-card"><h2>إثبات نقلة وصلت المعصرة</h2><p class="mill-small">سجل منصة المصدر وطريقة الوصول، ثم وزن العربية محملة وفارغة. الصافي هو وزن الزيتون المستلم فعليًا، ولا يتطلب ربطًا بفواتير الشراء.</p><form id="millForm"><div class="mill-form-grid"><div><label>تاريخ الوصول *</label><input id="arrivalDate" type="date" required></div><div><label>المعصرة *</label><select id="millCode"><option value="MATROUH">مطروح</option><option value="SADAT">السادات</option><option value="ABYAD">الأبيض</option></select></div><div><label for="sourceSite">منصة المصدر *</label><select id="sourceSite" required><option value="">اختر منصة المصدر</option><option value="QASR_MATROUH">القصر — مطروح</option><option value="BARRANI_NEGILA">براني والنجلية</option><option value="DABAA_RAS_EL_HEKMA">الضبعة ورأس الحكمة</option></select></div><div><label for="arrivalMode">طريقة وصول الزيتون *</label><select id="arrivalMode" required><option value="">اختر طريقة الوصول</option><option value="FROM_YARD">نقل داخلي من الشادر</option><option value="DIRECT">وصول مباشر من منصة الشراء</option></select></div><div><label>رقم العربية *</label><input id="vehiclePlate" maxlength="80" required></div><div><label>السائق</label><input id="driverName" maxlength="180"></div><div><label>وزن العربية محملة *</label><input id="grossKg" type="number" step=".001" min=".001" required></div><div><label>وزن العربية فارغة *</label><input id="tareKg" type="number" step=".001" min="0" required></div><div><label>الصافي المحسوب</label><output id="netKg" class="mill-net">—</output></div><div><label>رقم تذكرة البسكول — اختياري</label><input id="weighbridgeNo" maxlength="160"></div><div><label>جهة سداد النقل</label><select id="transportPayer"><option value="PLATFORM">المنصة — من مصاريف المحاسب</option><option value="MILL">المعصرة</option><option value="NONE">بدون تكلفة نقل مسجلة</option></select></div><div class="mill-transport" hidden><label>نقل مدفوع من المعصرة</label><input id="transportAmount" type="number" min="0" step=".01" value="0"></div><div class="mill-transport" hidden><label>مرجع مستند النقل *</label><input id="transportReference" maxlength="160"></div><div class="full"><h3>تفصيل الأصناف — اختياري</h3><p class="mill-small">لو الوزن لكل صنف غير معروف اترك الجدول فارغًا. أي تفصيل يجب أن يساوي صافي النقلة. «توزيع نسبي» و«إدخال يدوي» ليسا وزنًا مقاسًا.</p><div class="mill-table-scroll"><table><thead><tr><th>الصنف</th><th>كجم</th><th>أساس التفصيل</th><th></th></tr></thead><tbody id="millLines"></tbody></table></div><button type="button" class="btn gray" id="millAddLine">إضافة صنف</button></div><div class="full"><label>ملاحظات / المورد أو منطقة الشراء</label><textarea id="millNotes" maxlength="2000"></textarea></div><div class="full"><label>تذكرة البسكول ومستندات النقل — حتى 3 ملفات</label><input id="millFiles" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf"></div></div><p class="mill-small">نقل المعصرة يعرض كمصروف منفصل ينتظر مراجعة الربط، ولا يخصم من عهدة المنصة. إذا سبق دفعه من المنصة لا تسجله مرة أخرى.</p><div class="mill-actions"><button class="btn" id="millSave">حفظ النقلة</button><button type="button" class="btn gray" id="millRetry" hidden>إعادة نفس الطلب</button><button type="button" class="btn gray" id="millNew">نقلة جديدة</button></div></form></section><section class="report-card"><h2>سجل النقلات</h2><p class="mill-small" id="millCount"></p><div class="mill-table-scroll"><table><thead><tr><th>الرقم والتاريخ</th><th>المعصرة والمصدر</th><th>العربية والبسكول</th><th>المحملة</th><th>الفارغة</th><th>الصافي</th><th>النقل</th><th>الحالة / المنفذ</th><th></th></tr></thead><tbody id="millTrips"></tbody></table></div><div id="millDetail"></div></section></div></template><script src="../js/api.js"></script><script src="../js/layout.js?v=20261017-approved-01"></script><script src="./olive-navigation.js?v=20261013-portal1"></script><script>document.body.id='oliveOperational';document.body.classLis
