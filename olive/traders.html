<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شراء تجار الزيتون</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/mi-app.css"><link rel="stylesheet" href="../css/report-ui.css"><link rel="stylesheet" href="../css/bootstrap-theme.css"><link rel="stylesheet" href="./olive-project.css"><link rel="stylesheet" href="./traders.css"></head>
<body><template id="traderTemplate"><div class="olive-workspace report-ui-page" id="traderWorkspace">
<div id="traderMessage" role="status" aria-live="polite"></div><button id="traderRetry" type="button" class="btn gray" hidden>إعادة نفس العملية</button>
<nav class="trader-tabs" aria-label="شراء تجار"><button type="button" data-tab="shipments">الشحنات</button><button type="button" data-tab="suppliers">الموردون</button><button type="button" data-tab="settlement">تسوية المحاسب والسلف</button><button type="button" data-tab="statement" data-permission="reports">كشف المورد</button><button type="button" data-tab="review" data-permission="correct">المراجعة والتصحيح</button></nav>
<section class="report-card trader-filters"><div><label for="traderSupplier">المورد</label><select id="traderSupplier"><option value="">كل الموردين</option></select><input id="supplierSearch" placeholder="بحث بكود أو اسم المورد" aria-label="بحث الموردين"><button type="button" id="supplierSearchButton" class="btn gray">بحث</button></div><div><label for="traderSite">الموقع</label><input id="traderSite" list="traderSites" maxlength="80" placeholder="اختر الموقع"><datalist id="traderSites"></datalist></div><div><label for="traderSession">جلسة النقدية</label><select id="traderSession"><option value="">اختر جلستك المفتوحة</option></select><small><a href="./index.html">فتح ومراجعة الجلسات</a></small></div><div><label for="traderFrom">من</label><input id="traderFrom" type="date"></div><div><label for="traderTo">إلى</label><input id="traderTo" type="date"></div><div><label for="traderStatus">حالة الشحنة</label><select id="traderStatus"><option value="">كل الحالات</option><option value="RECEIVED">تحت العصر والتسعير</option><option value="APPROVED">معتمدة دون فاتورة</option><option value="INVOICED">مفوترة</option><option value="CANCELLED">ملغاة</option></select></div><div><label for="traderShipmentFilter">رقم الشحنة</label><input id="traderShipmentFilter" inputmode="numeric" pattern="[1-9][0-9]*"></div><div><label for="traderHistorySession">جلسة مرتبطة — للتصفية</label><input id="traderHistorySession" inputmode="numeric" pattern="[1-9][0-9]*"></div><button type="button" id="traderRefresh" class="btn">تحديث</button></section>

<section data-panel="suppliers" hidden><section class="report-card"><h2>سجل الموردين</h2><form id="supplierForm" data-permission="suppliers"><input name="supplierId" type="hidden"><div class="trader-grid"><label>كود المورد<input name="code" maxlength="80" required></label><label>الاسم<input name="name" maxlength="220" required></label><label>الهاتف<input name="phone" maxlength="80"></label><label>الرقم التعريفي<input name="nationalId" maxlength="120"></label><label>العنوان<input name="address" maxlength="1000"></label><label>سبب التعديل<input name="reason" maxlength="2000" value="تعريف مورد"></label></div><button class="btn">حفظ المورد</button><button type="reset" class="btn gray">مورد جديد</button></form><div class="trader-scroll"><table><thead><tr><th>الكود</th><th>الاسم</th><th>التواصل</th><th>الحالة</th><th></th></tr></thead><tbody id="supplierRows"></tbody></table></div><div id="supplierPageInfo"></div><button id="supplierPrevious" type="button" class="btn gray">السابق</button><button id="supplierNext" type="button" class="btn gray">التالي</button></section></section>

<section data-panel="shipments"><details class="report-card" data-permission="receive"><summary>استلام شحنة شراء تجار</summary><form id="shipmentForm"><div class="trader-grid"><label>رقم الشحنة<input name="shipmentNo" maxlength="100" required></label><label>تاريخ ووقت الوصول<input name="arrivedAt" type="datetime-local" required></label><label>المعصرة<select name="millCode"><option value="MATROUH">مطروح</option><option value="SADAT">السادات</option><option value="ABYAD">الأبيض</option></select></label><label>الاستلام الفعلي<select name="deliveryMode"><option value="YARD">منصة التجميع</option><option value="DIRECT_MILL">مباشرة للمعصرة</option></select></label><label>الصنف<select name="varietyId" id="traderVariety" required></select></label><label>العربية<input name="vehiclePlate" maxlength="80"></label><label>السائق<input name="driverName" maxlength="180"></label><label>رقم البسكول<input name="ticketNo" maxlength="160" required></label><label>تاريخ البسكول<input name="ticketDate" type="date" required></label><label>القائم كجم<input name="grossKg" type="number" step=".001" min=".001" required></label><label>الفارغ كجم<input name="tareKg" type="number" step=".001" min="0" required></label><label>رقم نقلة معصرة مسجلة — اختياري<input name="millDeliveryId" inputmode="numeric" pattern="[1-9][0-9]*"></label><label class="trader-wide">تذكرة البسكول — 1 إلى 3 مستندات<input name="attachments" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp" required></label></div><p>كل شحنة مستقلة في العصر والسعر، والكميات تنتظر التسعير حتى اعتماد نتائجها.</p><button class="btn">حفظ الاستلام</button></form></details>
<section class="report-card"><div class="trader-actions"><h2>شحنات شراء التجار</h2><button type="button" id="shipmentsExcel" class="btn gray" data-permission="reports">Excel</button><button type="button" id="issueSelected" class="btn" data-permission="approve">إصدار فواتير المحدد</button></div><div class="trader-scroll"><table><thead><tr><th>اختيار</th><th>الشحنة / المورد</th><th>الوصول / الموقع</th><th>الاستلام / البسكول</th><th>صافي الزيتون كجم</th><th>الزيت الفعلي كجم</th><th>سعر كجم الزيت</th><th>الاستحقاق</th><th>المتبقي</th><th>الحالة</th><th></th></tr></thead><tbody id="shipmentRows"></tbody><tfoot id="shipmentTotals"></tfoot></table></div><p id="shipmentPageInfo"></p><div class="trader-actions"><button type="button" id="shipmentPrevious" class="btn gray">السابق</button><button type="button" id="shipmentNext" class="btn gray">التالي</button></div></section>
<section class="report-card" id="shipmentDetail" hidden><div class="trader-actions"><h2 id="shipmentHeading"></h2><button type="button" id="detailClose" class="btn gray">إغلاق التفاصيل</button></div><div id="shipmentFacts"></div><div id="shipmentDocuments" class="trader-actions"></div><h3>دفعات العصر</h3><div class="trader-scroll"><table><thead><tr><th>الدفعة</th><th>التاريخ</th><th>الزيت كجم</th><th>الحالة</th><th></th></tr></thead><tbody id="batchRows"></tbody><tfoot id="batchTotals"></tfoot></table></div>
<form id="batchForm" data-permission="press"><div class="trader-grid"><label>رقم دفعة العصر<input name="batchNo" maxlength="100" required></label><label>التاريخ والوقت<input name="pressedAt" type="datetime-local" required></label><label>الزيت الناتج كجم<input name="oilKg" type="number" min=".001" step=".001" required></label></div><button class="btn">إضافة نتيجة عصر</button><button type="button" id="completePress" class="btn gray">تأكيد اكتمال نتائج الشحنة</button><button type="button" id="reopenPress" class="btn gray">استكمال النتائج قبل الاعتماد</button></form>
<form id="priceForm" data-permission="price"><h3>اتفاق السعر</h3><div class="trader-grid"><label>سعر كجم الزيت جنيه<input name="oilPrice" type="number" min=".0001" step=".0001" required></label><label>تاريخ الاتفاق<input name="agreedAt" type="datetime-local" required></label><label>السبب<input name="reason" maxlength="2000" required></label></div><button class="btn">حفظ الاتفاق</button></form><div data-permission="approve"><label for="approvalReason">ملاحظة الاعتماد / سبب استثناء إداري إذا كنت منشئ الشحنة</label><input id="approvalReason" maxlength="2000"><button type="button" id="approveShipment" class="btn">اعتماد الاستحقاق</button><button type="button" id="issueInvoice" class="btn">إصدار فاتورة الشحنة</button></div><h3>السداد والتخصيصات</h3><div id="shipmentPaymentLinks"></div></section></section>

<section data-panel="settlement" hidden><section class="report-card"><h2>سلف الموردين والتجار</h2><form id="advanceForm" data-permission="advances"><div class="trader-grid"><label>المبلغ النقدي<input name="amount" type="number" min=".01" step=".01" required></label><label>تاريخ ووقت الصرف<input name="issuedAt" type="datetime-local" required></label><label>مقيدة بشحنة رقم — اختياري<input name="shipmentId" inputmode="numeric" pattern="[1-9][0-9]*"></label><label>البيان<input name="reason" maxlength="2000" required></label><label class="trader-wide">سند الصرف<input name="attachments" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp" required></label></div><p class="trader-cash">صرف نقدي: ينقص درج الجلسة مرة واحدة ويظل رصيد السلفة متاحًا بعد إغلاقها.</p><button class="btn">صرف سلفة مورد / تاجر على حساب التوريد</button></form></section>
<section class="report-card"><h2>تسوية المحاسب</h2><p>اختر المورد والموقع لعرض فواتيره وسلفه عبر الأيام. راجع توزيع التسوية قبل الاعتماد.</p><button type="button" id="loadSettlement" class="btn gray">عرض الفواتير والسلف</button><div id="settlementScope"></div><div class="trader-scroll"><table><thead><tr><th>اختيار</th><th>الفاتورة / الشحنة</th><th>المستحق</th><th>المدفوع</th><th>المتبقي</th></tr></thead><tbody id="settlementInvoices"></tbody></table></div><h3>السلف المتاحة</h3><div class="trader-scroll"><table><thead><tr><th>السلفة</th><th>الجلسة الأصلية</th><th>مقيدة بشحنة</th><th>المبلغ</th><th>المستخدم</th><th>المردود</th><th>المتاح</th></tr></thead><tbody id="settlementAdvances"></tbody></table></div><button type="button" id="proposeSettlement" class="btn gray">اقتراح توزيع للمحدد</button>
<form id="settlementForm" data-permission="pay"><div id="allocationEditor"></div><div id="settlementSummary" aria-live="polite"></div><label>سبب التسوية<input name="reason" maxlength="2000" required></label><label>مستندات السداد النقدي<input name="attachments" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp"></label><button class="btn">اعتماد التوزيع والسداد النقدي المعروض</button></form></section>
<section class="report-card" data-permission="pay"><h2>رد نقدي لباقي سلفة</h2><form id="returnForm"><div class="trader-grid"><label>رقم السلفة<input name="advanceId" inputmode="numeric" pattern="[1-9][0-9]*" required></label><label>المبلغ المستلم نقدًا<input name="amount" type="number" min=".01" step=".01" required></label><label>وقت القبض<input name="receivedAt" type="datetime-local" required></label><label>البيان<input name="reason" maxlength="2000" required></label><label class="trader-wide">سند القبض<input name="attachments" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp" required></label></div><p class="trader-return">رد نقدي: يزيد الجلسة المفتوحة المستقبلة ويخفض السلفة المتاحة.</p><button class="btn">إثبات استلام النقدية من المورد</button></form></section></section>

<section data-panel="statement" hidden><section class="report-card"><div class="trader-actions"><h2>كشف حساب المورد</h2><p>التصدير يشمل كامل الفلتر حتى 200 حركة؛ يُرفض إذا تجاوز الحد. ضيّق الفترة أو الفلاتر. الإجماليات لكامل الفلتر، وصافي الصفحة معروض منفصلًا.</p><button id="statementLoad" type="button" class="btn">عرض الكشف</button><button id="statementExcel" type="button" class="btn gray">Excel</button></div><label>رقم جلسة للتصفية — اختياري<input id="statementSessionFilter" inputmode="numeric"></label><div id="statementBalances"></div><div class="trader-scroll"><table><thead><tr><th>التاريخ / العملية</th><th>الشحنة</th><th>الفاتورة</th><th>السلفة</th><th>الجلسة</th><th>المبلغ</th><th>أثر حساب المورد</th><th>الرصيد</th></tr></thead><tbody id="statementRows"></tbody><tfoot id="statementTotals"></tfoot></table></div><p id="statementPageInfo"></p><button type="button" id="statementPrevious" class="btn gray">السابق</button><button type="button" id="statementNext" class="btn gray">التالي</button><p>الرصيد الموجب مستحق للمورد، والسالب أموال لدى المورد لحساب الشركة. تخصيص السلفة لا يخصم الرصيد مرة ثانية.</p></section></section>

<section data-panel="review" hidden><section class="report-card"><h2>التصحيح والمراجعة</h2><p>خطأ وزن أو عصر بعد الاعتماد: بلاغ موثق يعلّق التسوية دون تغيير الأصل. الخطأ المؤكد يبقى معلقًا لحين تنفيذ مسار تصحيح كميات معتمد؛ لا يوجد تحرير لهذا التعليق بتعديل المستند.</p><p>الأصول محفوظة. عكس التخصيص غير نقدي، ورد الدفعة يحتاج تأكيد استلام النقدية في الجلسة الحالية.</p><form id="correctionForm"><div class="trader-grid"><label>الإجراء<select name="action"><option value="review-hold">تعليق شحنة لخطأ وزن أو عصر</option><option value="review-decision">قرار مراجعة الشحنة</option><option value="price-correction">تصحيح سعر شحنة معتمدة</option><option value="allocation-reversals">عكس تخصيص سلفة — غير نقدي</option><option value="payment-returns">رد دفعة نقدية بالكامل — قبض فعلي</option><option value="batch-reversals">عكس دفعة عصر قبل الاعتماد</option><option value="cancel">إلغاء شحنة غير مفوترة</option></select></label><label>رقم المستند<input name="entityId" inputmode="numeric" pattern="[1-9][0-9]*" required></label><label>نوع البلاغ<select name="issueType"><option value="WEIGHT">وزن</option><option value="PRESS">عصر</option></select></label><label>قرار المراجعة<select name="decision"><option value="ERROR_CONFIRMED">خطأ مؤكد — يستمر التعليق</option><option value="ORIGINAL_VERIFIED">تم إثبات صحة الأصل — رفع التعليق</option></select></label><label>سبب استثناء مراجعة المبلّغ<input name="overrideReason" maxlength="2000"></label><label>السعر المصحح — عند تصحيح السعر<input name="oilPrice" type="number" min=".0001" step=".0001"></label><label>تاريخ الاتفاق المصحح<input name="agreedAt" type="datetime-local"></label><label>السبب<input name="reason" maxlength="2000" required></label><label>المستندات<input name="attachments" type="file" multiple accept=".pdf,.png,.jpg,.jpeg,.webp" required></label></div><label><input name="cashReceived" type="checkbox"> استلمت نقدية الدفعة المرتجعة فعليًا</label><button class="btn">تسجيل التصحيح الموثق</button></form></section><section class="report-card" id="siteGrantPanel" hidden><h2>إسناد المواقع — للأدمن</h2><form id="siteGrantForm"><div class="trader-grid"><label>معرّف المستخدم<input name="userId" maxlength="80" required></label><label>الموقع<input name="siteCode" maxlength="80" required></label><label>سبب الإسناد<input name="reason" maxlength="2000" required></label><label><input name="revoke" type="checkbox"> إلغاء الإسناد</label></div><button class="btn">حفظ إسناد الموقع</button></form></section><section class="report-card"><button type="button" id="auditLoad" class="btn gray">تحديث سجل المراجعة</button><div id="traderAudit"></div></section></section>
</div></template><script src="../js/api.js"></script><script src="../js/layout.js?v=20261017-approved-01"></script><script src="./olive-navigation.js?v=20261024-traders1"></script><script>
document.body.id='oliveOperational';document.body.classList.add('olive-operational-page');REPORT_PAGE_MAP['olive-traders']='olive.traders.view';renderLayout('شراء تجار الزيتون','الشحنات والعصر واتفاق السعر وسلف الموردين وتسويتها','olive-traders',document.getElementById('traderTemplate').innerHTML);
</script><script src="./trader-safe-save.js"></script><script src="./trader-references.js"></script><script src="./traders.js"></script></body></html>
