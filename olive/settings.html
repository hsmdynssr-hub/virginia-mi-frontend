<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعدادات موسم الزيتون</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/mi-app.css?v=20260908-project-unified-01">
<style>
body{background:#f6f7f3}.wrap{max-width:1150px;margin:20px auto;padding:0 12px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.c12{grid-column:span 12}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
input,select,textarea{width:100%;padding:9px;border:1px solid #bbb;border-radius:8px}.btn{padding:9px 13px;background:#3d6b35;color:#fff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.gray{background:#586174}.red{background:#a22}
table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;vertical-align:middle}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#e8f5e9;font-size:12px}.off{background:#eee;color:#666}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{background:#fff;border-radius:14px;padding:18px;max-width:780px;width:100%;max-height:85vh;overflow:auto}
.logo-preview{max-height:90px;max-width:220px;display:block;margin:8px 0;border:1px solid #ddd;padding:5px;border-radius:8px}
@media(max-width:700px){.c6,.c4,.c3{grid-column:span 12}}
</style></head><body><div class="wrap">
<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h1>⚙️ إعدادات موسم الزيتون</h1><p>الأصناف والأسعار + تصميم فاتورة الكاشير</p></div><div><a class="btn gray" href="./index.html">استلام جديد</a> <a class="btn gray" href="./admin.html">التحليل</a></div></div>
<div id="msg"></div>

<div class="card"><h3>🫒 الأصناف والأسعار</h3><div class="grid">
<div class="c6"><label>اسم الصنف</label><input id="name"></div><div class="c3"><label>كود اختياري</label><input id="code"></div><div class="c3" style="padding-top:22px"><button class="btn" id="addBtn">إضافة صنف</button></div>
</div><hr><div style="overflow:auto"><table><thead><tr><th>الصنف</th><th>الحالة</th><th>السعر الحالي</th><th>ساري من</th><th>إجراءات</th></tr></thead><tbody id="body"></tbody></table></div></div>

<div class="card"><h3>🧾 تصميم الفاتورة والشعار</h3><div class="grid">
<div class="c4"><label>اسم الشركة</label><input id="companyName"></div>
<div class="c4"><label>عنوان الإيصال</label><input id="receiptTitle"></div>
<div class="c4"><label>عرض الورق</label><select id="paperWidth"><option value="80">80mm</option><option value="58">58mm</option></select></div>
<div class="c6"><label>عنوان الشركة</label><input id="companyAddress"></div>
<div class="c6"><label>هاتف الشركة</label><input id="companyPhone"></div>
<div class="c12"><label>نص أسفل الفاتورة</label><textarea id="footerText" rows="2" placeholder="مثال: شكراً لتوريدكم"></textarea></div>
<div class="c6"><label>شعار الشركة</label><input id="logoFile" type="file" accept="image/*"><img id="logoPreview" class="logo-preview" style="display:none"></div>
<div class="c6">
<label><input id="showPhone" type="checkbox" style="width:auto"> إظهار هاتف المورد</label><br>
<label><input id="showNationalId" type="checkbox" style="width:auto"> إظهار الرقم القومي</label><br>
<label><input id="showVehicle" type="checkbox" style="width:auto"> إظهار رقم السيارة</label>
</div>
<div class="c12"><button class="btn" id="savePrint">حفظ تصميم الفاتورة</button> <button class="btn red" id="removeLogo">حذف الشعار</button></div>
</div></div>
</div>

<div class="modal" id="priceModal"><div class="box"><h3 id="priceTitle">تغيير السعر</h3><input type="hidden" id="varietyId"><div class="grid">
<div class="c4"><label>السعر الجديد / كجم</label><input id="price" type="number" min="0" step=".01"></div>
<div class="c4"><label>ساري من</label><input id="effectiveFrom" type="datetime-local"></div>
<div class="c4"><label>سبب التغيير</label><input id="reason" placeholder="سعر شراء اليوم"></div>
<div class="c12"><button class="btn" id="savePrice">حفظ السعر</button> <button class="btn gray" id="closePrice">إغلاق</button></div>
</div><hr><h4>تاريخ الأسعار</h4><div style="overflow:auto"><table><thead><tr><th>السعر</th><th>من</th><th>إلى</th><th>السبب</th><th>بواسطة</th></tr></thead><tbody id="history"></tbody></table></div></div></div>

<script src="../js/api.js"></script><script src="./settings.js?v=2"></script></body></html>
