<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استلام الزيتون</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/mi-app.css?v=20260908-project-unified-01">
<link rel="stylesheet" href="../css/report-ui.css"><link rel="stylesheet" href="../css/bootstrap-theme.css"><link rel="stylesheet" href="./olive-project.css?v=20261020-corrections1"></head><body><template id="olivePageTemplate"><div class="olive-workspace report-ui-page">
<div class="pos-toolbar"><p class="pos-note">الفواتير والسداد وعهدة المحاسب</p><a class="btn gray" href="./settings.html">الإعدادات</a><span id="advancedLink" hidden aria-hidden="true" style="display:none!important"></span></div><section class="card report-card" aria-label="جلسة عهدة المحاسب">
<div class="cash-compact-bar"><div><strong>عهدة المحاسب</strong><span id="cashOwn">جارٍ تحميل الجلسة…</span></div><div class="cash-compact-balance"><small>المتبقي</small><strong id="cashCompactBalance">—</strong></div><div class="cash-compact-actions"><button type="button" class="btn gray" id="cashToggle" aria-expanded="false" aria-controls="cashPanel">تفاصيل الجلسة</button><button type="button" class="btn gray" id="cashExpenseShortcut">تسجيل مصروف</button><button type="button" class="btn gray" id="cashRefresh">تحديث</button></div></div>
<div id="cashMessage" role="status"></div><button type="button" class="btn gray" id="cashRetry" hidden>إعادة نفس العملية</button>
<div id="cashPanel" hidden><div id="cashOpenBox" class="cash-row"><div><label for="cashOpening">الرصيد الافتتاحي النقدي</label><input id="cashOpening" type="number" min="0" step=".01" placeholder="0.00"></div><button type="button" class="btn" id="cashOpen">فتح جلسة</button></div>
<div id="cashReviewBox" style="margin-top:14px"><label for="cashChoose">مراجعة جلسة / جلسات سابقة</label><select id="cashChoose"></select></div>
<div id="cashDetails" hidden><h3 id="cashHeading"></h3><small id="cashTimes"></small><div id="cashSummary" class="cash-summary report-kpi-grid"></div><p id="cashWarning" class="cash-warning"></p><p id="cashSnapshot" class="cash-notes"></p>
<div id="cashMoveBox" hidden><h3>إضافة رصيد / دعم — للأدمن</h3><div class="grid"><div class="c3"><label for="cashKind">نوع الحركة</label><select id="cashKind"><option value="FUNDING">إضافة رصيد / دعم</option></select></div><div class="c3"><label for="cashAmount">المبلغ</label><input id="cashAmount" type="number" min=".01" step=".01"></div><div class="c6"><label for="cashReason">السبب / المنطقة / مرجع الشحنة</label><input id="cashReason" maxlength="2000"></div><div class="c3 expense-field"><label for="cashCategory">تصنيف المصروف *</label><select id="cashCategory"><option value="">اختر التصنيف</option><option value="COMMISSION">عمولة</option><option value="TRANSPORT">نقل وشحن</option><option value="LABOR">عمالة وتحميل وتعتيق</option><option value="MEALS">وجبات</option><option value="OPERATING">تشغيل وانتقالات</option><option value="EXTERNAL_PURCHASE">شراء خارجي — بانتظار ربط الفاتورة</option><option value="EXTERNAL_ADVANCE">عهدة خارجية — بانتظار التسوية</option><option value="OTHER">مصروف آخر — يحتاج مراجعة التكلفة</option></select></div><div class="c3 expense-field"><label for="cashExpenseDate">تاريخ المصروف *</label><input id="cashExpenseDate" type="date"></div><div class="c3 expense-field"><label for="cashBeneficiary">المستفيد / المورد</label><input id="cashBeneficiary" maxlength="220"></div><div class="c3 expense-field"><label for="cashReference">رقم المستند / الشحنة</label><input id="cashReference" maxlength="160"></div><div class="c12"><label for="cashFiles">المستندات المطلوبة — حتى 3 ملفات، 5MB لكل ملف، إجمالي 12MB</label><input id="cashFiles" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf"></div></div><p class="cash-notes">لصرف عهدة أو تسجيل مصروف استخدم قسم العهد والمصروفات أسفل تفاصيل الجلسة.</p><button type="button" id="cashMove" class="btn">تسجيل الحركة</button></div>
<div id="cashLedgerBox"><h3>حركات الدعم والمصروفات</h3><div style="overflow:auto"><table><thead><tr><th>الحركة</th><th>المبلغ</th><th>التصنيف والمستفيد / المستند</th><th>السبب</th><th>بواسطة / التاريخ</th><th>المرفقات</th></tr></thead><tbody id="cashMovements"></tbody></table></div></div>
<div id="cashCloseBox" hidden style="margin-top:16px"><h3>إغلاق الجلسة</h3><div class="cash-row"><div><label for="cashActual">النقدية الفعلية عند الإغلاق</label><input id="cashActual" type="number" min="0" step=".01"></div><div><label for="cashCloseNote">ملاحظة / سبب فرق النقدية</label><input id="cashCloseNote" maxlength="2000"></div><button type="button" class="btn red" id="cashClose">إغلاق الجلسة</button></div></div>
</div></div><details id="expenseWorkspace" class="olive-expense-workspace"><summary>العهد والمصروفات — صرف / بيان متعدد البنود / تسوية</summary>
<p class="cash-notes">صرف العهدة ينقص النقدية مرة واحدة. بيان التسوية يثبت المصروفات الفعلية دون خصم جديد، ويمكن تسجيله لاحقًا ولو أغلقت الجلسة. لا تسجل نفس المصروف كصرف مباشر وتسوية معًا.</p><div id="expenseMessage" role="status"></div><button type="button" class="btn gray" id="expenseRetry" hidden>إعادة نفس الطلب</button>
<form id="expenseEntryForm"><div class="grid"><div class="c6"><label for="expenseMode">العملية</label><select id="expenseMode"><option value="ADVANCE">صرف عهدة تحت التسوية</option><option value="DIRECT">صرف مباشر — عدة بنود</option><option value="SETTLEMENT">بيان تسوية عهدة سابقة — دون خصم جديد</option><option value="RETURN">استلام نقد مرتجع من عهدة</option></select></div><div class="c6" id="expenseAdvanceField" hidden><label for="expenseAdvance">العهدة الأصلية</label><select id="expenseAdvance"></select></div><div class="c12"><label for="expenseReason">الغرض / عنوان البيان</label><input id="expenseReason" maxlength="2000" required></div></div><p class="cash-notes" id="expenseModeNote"></p>
<div id="expenseCashFields" class="grid"><div class="c3"><label for="expenseCashAmount">المبلغ النقدي</label><input id="expenseCashAmount" type="number" min=".01" step=".01" required></div><div class="c3" id="expenseBeneficiaryField"><label for="expenseBeneficiary">مستلم العهدة</label><input id="expenseBeneficiary" maxlength="220"></div><div class="c6" id="expenseReturnSessionField" hidden><label for="expenseReturnSession">الجلسة المفتوحة المستلمة للمرتجع</label><select id="expenseReturnSession"></select></div><div class="c12"><label for="expenseCashFiles">إيصال صرف / استلام النقد — مطلوب</label><input id="expenseCashFiles" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf" required></div></div>
<div id="expenseLinesBox" hidden><p class="cash-notes">حتى 30 بندًا. لكل بند من مستند واحد إلى 3؛ 5MB لكل ملف وإجمالي مرفقات البيان 12MB. البنود المسجلة نهائية وتظهر في سجل المراجعة.</p><div style="overflow:auto"><table class="olive-expense-entry-table"><thead><tr><th>التصنيف / التاريخ</th><th>البيان / المستفيد / المرجع</th><th>المبلغ</th><th>المرفقات</th><th></th></tr></thead><tbody id="expenseEntryLines"></tbody><tfoot><tr><th colspan="2">إجمالي البيان</th><th id="expenseEntryTotal">0.00</th><th colspan="2"></th></tr></tfoot></table></div><button type="button" class="btn gray" id="expenseAddLine">+ بند مصروف</button></div><button type="submit" class="btn" id="expenseSubmit">تسجيل العملية</button></form>
<h3>العهد المصروفة وموقف التسوية</h3><button type="button" class="btn gray" id="expenseRefresh">تحديث السجل</button><div style="overflow:auto"><table><thead><tr><th>العهدة / الجلسة</th><th>المستلم / الغرض</th><th>المصروف نقدًا</th><th>مصروفات مثبتة</th><th>نقد مرتجع</th><th>تحت التسوية</th><th>المنفذ / التاريخ</th></tr></thead><tbody id="expenseAdvancesBody"></tbody><tfoot id="expenseAdvancesFoot"></tfoot></table></div><h3>بيانات المصروفات المسجلة</h3><p id="expenseStatementsCount" class="cash-notes"></p><div style="overflow:auto"><table><thead><tr><th>البيان / الجلسة</th><th>الغرض / تفاصيل البنود</th><th>المبلغ</th><th>المنفذ / التاريخ</th></tr></thead><tbody id="expenseStatementsBody"></tbody><tfoot id="expenseStatementsFoot"></tfoot></table></div></details></section>
<div id="msg"></div><div class="pos-grid"><section class="card report-card"><div class="pos-toolbar"><h3>الأصناف المتاحة للشراء</h3><button type="button" class="btn gray" id="catalogRefresh">تحديث الأسعار</button><input id="productSearch" placeholder="بحث عن صنف" aria-label="بحث عن صنف"></div><div id="products" class="olive-products"></div><p class="pos-note">اختر الصنف لإضافته للفاتورة، ثم أدخل الوزن. السعر من قائمة الموسم.</p></section><form id="f">
<div class="card report-card"><h3>المورد</h3><div class="grid"><div class="c4"><label>اسم المورد *</label><input id="supplierName" required></div><div class="c4"><label>الهاتف</label><input id="supplierPhone"></div><div class="c4"><label>الرقم القومي</label><input id="supplierNationalId"></div><div class="c6"><label>العنوان</label><input id="supplierAddress"></div><div class="c3"><label>السيارة</label><input id="vehiclePlate"></div><div class="c3"><label>موقع جلسة المحاسب</label><input id="siteCode" value="MAIN"></div></div></div>
<div class="card report-card"><div style="display:flex;justify-content:space-between"><h3>الأصناف</h3><button type="button" class="btn" id="add">+ صنف</button></div><div style="overflow:auto"><table class="invoice-lines"><thead><tr><th>الصنف</th><th>كجم</th><th>السعر/كجم</th><th>الإجمالي</th><th></th></tr></thead><tbody id="lines"></tbody></table></div><div class="total"><span id="grand">0.00</span> جنيه</div><small>السعر معتمد من إعدادات الموسم ولا يمكن تغييره من الفاتورة. تغيير الأسعار من مسؤول الأسعار فقط.</small></div>
<div class="card report-card"><h3>منصة التجميع وطريقة التسليم</h3><div class="grid"><div class="c4"><label for="collectionPlatform">منصة التجميع *</label><select id="collectionPlatform" required><option value="">اختر المنصة</option><option value="QASR_MATROUH">القصر — مطروح</option><option value="BARRANI_NEGILA">براني والنجلية</option><option value="DABAA_RAS_EL_HEKMA">الضبعة ورأس الحكمة</option></select></div><div class="c4"><label for="deliveryMode">طريقة تسليم الزيتون *</label><select id="deliveryMode" required><option value="">اختر طريقة التسليم</option><option value="YARD">استلام في الشادر</option><option value="DIRECT_MILL">نقل مباشر إلى معصرة</option></select></div><div class="c4" id="destinationMillField" hidden><label for="destinationMill">المعصرة *</label><select id="destinationMill"><option value="">اختر المعصرة</option><option value="MATROUH">مطروح</option><option value="SADAT">السادات</option><option value="ABYAD">الأبيض</option></select></div></div><p>منصة التجميع تخص مشتريات المورد أو المسؤول، والسداد يسجل على جلسة المحاسب الحالية.</p></div>
<div class="card report-card"><h3>السداد</h3><div class="grid"><div class="c12"><label>حالة السداد *</label><select id="paymentIntent"><option value="FULL">سداد كامل</option><option value="PARTIAL">سداد جزئي</option><option value="UNPAID">آجل / لم يُدفع</option></select></div><div class="c3"><label>المدفوع الآن</label><input id="paid" type="number" min="0" step=".01" value="0" readonly></div><div class="c3"><label>الطريقة</label><select id="method"><option value="CASH">نقدي</option><option value="BANK_TRANSFER">تحويل</option><option value="CHEQUE">شيك</option><option value="OTHER">أخرى</option></select></div><div class="c3"><label>مرجع</label><input id="ref"></div><div class="c3" style="padding-top:23px"><button type="button" id="full" class="btn gray">دفع كامل</button></div><div class="c12"><label>ملاحظات</label><textarea id="notes"></textarea></div></div></div>
<div class="card report-card"><h3>المرفقات</h3><div class="grid"><div class="c6"><label>صورة البطاقة</label><input id="idcard" type="file" accept="image/*" capture="environment"></div><div class="c6"><label>إيصال / مستند</label><input id="doc" type="file" accept="image/*" capture="environment"></div></div></div>
<div class="card report-card"><button class="btn" id="save" disabled>حفظ</button> <button type="button" class="btn gray" id="print" disabled>طباعة</button> <button type="button" class="btn red" id="new">جديد</button></div>
</form></div></div></template><script src="../js/api.js"></script><script src="../js/layout.js?v=20261017-approved-01"></script><script src="./olive-navigation.js?v=20261013-portal1"></script><script>document.body.id="oliveOperational";document.body.classList.add("olive-operational-page");renderLayout('استلام الزيتون وعهدة المحاسب',"شراء الزيتون ومراجعة العهدة والمستندات",'olive-receive',document.getElementById("olivePageTemplate").innerHTML);</script><script>window.OLIVE_REQUIRED_PERMISSION="olive.receive";</script><script src="./access-guard.js?v=12"></script><script src="./olive-expense-entries.js?v=20261015-1"></script><script src="./olive-cash-session.js?v=20261020-corrections1"></script><script src="./olive.js?v=20261016-delivery1"></script></body></html>
