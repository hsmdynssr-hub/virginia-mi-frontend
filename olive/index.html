<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استلام الزيتون</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/mi-app.css?v=20260908-project-unified-01">
<style>body{background:#f6f7f3}.wrap{max-width:1100px;margin:20px auto;padding:0 12px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.c12{grid-column:span 12}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}input,select,textarea{width:100%;padding:9px;border:1px solid #bbb;border-radius:9px}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #ddd}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;background:#3d6b35;color:#fff;cursor:pointer}.gray{background:#586174}.red{background:#a22}.msg{padding:10px;border-radius:9px;margin-bottom:10px}.ok{background:#dcfce7}.err{background:#fee2e2}.total{font-size:26px;font-weight:900;text-align:left}.override{background:#fff3cd!important}@media(max-width:700px){.c6,.c4,.c3{grid-column:span 12}}</style></head><body><div class="wrap">
<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h1>🫒 استلام الزيتون - موسم العصر</h1><p>استلام + دفع + مرفقات + طباعة كاشير</p></div><div><a class="btn gray" href="./admin.html">التحليل</a> <a class="btn gray" href="./settings.html">الإعدادات</a> <a class="btn gray" href="../dashboard/index.html">الرئيسية</a></div></div>
<div id="msg"></div><form id="f">
<div class="card"><h3>المورد</h3><div class="grid"><div class="c4"><label>اسم المورد *</label><input id="supplierName" required></div><div class="c4"><label>الهاتف</label><input id="supplierPhone"></div><div class="c4"><label>الرقم القومي</label><input id="supplierNationalId"></div><div class="c6"><label>العنوان</label><input id="supplierAddress"></div><div class="c3"><label>السيارة</label><input id="vehiclePlate"></div><div class="c3"><label>الموقع</label><input id="siteCode" value="MAIN"></div></div></div>
<div class="card"><div style="display:flex;justify-content:space-between"><h3>الأصناف</h3><button type="button" class="btn" id="add">+ صنف</button></div><div style="overflow:auto"><table><thead><tr><th>الصنف</th><th>كجم</th><th>السعر/كجم</th><th>الإجمالي</th><th></th></tr></thead><tbody id="lines"></tbody></table></div><div class="total"><span id="grand">0.00</span> جنيه</div><small>السعر يظهر تلقائياً من إعدادات الموسم. إذا تم تغييره يظل السطر مسجلاً كسعر معدل.</small></div>
<div class="card"><h3>الدفع</h3><div class="grid"><div class="c3"><label>المدفوع الآن</label><input id="paid" type="number" step=".01" value="0"></div><div class="c3"><label>الطريقة</label><select id="method"><option value="CASH">نقدي</option><option value="BANK_TRANSFER">تحويل</option><option value="CHEQUE">شيك</option><option value="OTHER">أخرى</option></select></div><div class="c3"><label>مرجع</label><input id="ref"></div><div class="c3" style="padding-top:23px"><button type="button" id="full" class="btn gray">دفع كامل</button></div><div class="c12"><label>ملاحظات</label><textarea id="notes"></textarea></div></div></div>
<div class="card"><h3>المرفقات</h3><div class="grid"><div class="c6"><label>صورة البطاقة</label><input id="idcard" type="file" accept="image/*" capture="environment"></div><div class="c6"><label>إيصال / مستند</label><input id="doc" type="file" accept="image/*" capture="environment"></div></div></div>
<div class="card"><button class="btn" id="save">حفظ</button> <button type="button" class="btn gray" id="print" disabled>طباعة</button> <button type="button" class="btn red" id="new">جديد</button></div>
</form></div><script src="../js/api.js"></script><script>window.OLIVE_REQUIRED_PERMISSION="olive.receive";</script><script src="./access-guard.js?v=12"></script><script src="./olive.js?v=2"></script></body></html>
