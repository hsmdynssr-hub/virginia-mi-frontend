<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحليل مشتريات الزيتون</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/mi-app.css"><link rel="stylesheet" href="../css/report-ui.css"><link rel="stylesheet" href="../css/bootstrap-theme.css"><link rel="stylesheet" href="./olive-project.css?v=20261012-scroll4"><link rel="stylesheet" href="./olive-portal.css?v=20261015-totals1"></head><body><template id="oliveAnalysisTemplate"><div class="olive-workspace report-ui-page"><div class="report-card"><div class="olive-analysis-filters"><label>طريقة العرض <select id="analysisMode"><option value="ALL">الكل — كل المشتريات</option><option value="DAY">يوم محدد</option><option value="SESSION">جلسة كاملة</option><option value="CUSTOM">فترة مخصصة</option></select></label><label id="analysisDayField" hidden>اليوم <input id="analysisDay" type="date"></label><label id="analysisFromField" hidden>من <input id="from" type="date"></label><label id="analysisToField" hidden>إلى <input id="to" type="date"></label><label>الجلسة <select id="analysisSession"><option value="">كل الجلسات</option><option value="UNASSIGNED">فواتير بدون جلسة</option></select></label><input id="q" placeholder="بحث"> <button class="btn" id="load">تحديث</button> <button class="btn" id="exportExcel">تصدير Excel</button></div></div><div id="msg" role="status"></div><div class="report-kpi-grid olive-analysis-kpis" hidden><div class="report-kpi-card"><span>عدد الفواتير</span><strong id="kc">0</strong></div><div class="report-kpi-card"><span>قيمة شراء الزيتون</span><strong id="kt">0</strong></div><div class="report-kpi-card"><span>المدفوع للموردين</span><strong id="kp">0</strong></div><div class="report-kpi-card"><span>مستحق الموردين غير المسدد</span><strong id="kb">0</strong></div></div><div class="olive-analysis-tabs" role="tablist" aria-label="تفاصيل التحليل"><button type="button" class="btn " id="tab-varieties" data-analysis-tab="varieties" role="tab" aria-selected="true" aria-controls="panel-varieties">حسب الصنف</button><button type="button" class="btn gray" id="tab-suppliers" data-analysis-tab="suppliers" role="tab" aria-selected="false" aria-controls="panel-suppliers">حسب المورد</button><button type="button" class="btn gray" id="tab-prices" data-analysis-tab="prices" role="tab" aria-selected="false" aria-controls="panel-prices">تفصيل الأسعار</button><button type="button" class="btn gray" id="tab-platforms" data-analysis-tab="platforms" role="tab" aria-selected="false" aria-controls="panel-platforms">المنصات وجهات التسليم</button><button type="button" class="btn gray" id="tab-receipts" data-analysis-tab="receipts" role="tab" aria-selected="false" aria-controls="panel-receipts">سجل الفواتير</button></div><div class="olive-analysis-panels"><section id="panel-varieties" role="tabpanel" aria-labelledby="tab-varieties"><div class="report-card"><h3>تجميع مستقل حسب الصنف</h3><p>متوسط سعر الشراء المرجح = قيمة الشراء ÷ الوزن. لا يشمل مصاريف التجميع أو النقل.</p><table><thead><tr><th>الصنف</th><th>الوزن</th><th>القيمة</th><th>متوسط سعر الشراء</th><th>أقل سعر</th><th>أعلى سعر</th><th>عدد الأسعار</th><th>سطور بسعر معدل</th></tr></thead><tbody id="vb"></tbody><tfoot id="varietyTotals" class="olive-report-total"></tfoot></table></div></section><section id="panel-suppliers" role="tabpanel" aria-labelledby="tab-suppliers" hidden><div class="report-card"><h3>تجميع مستقل حسب المورد</h3><p id="supplierCount"></p><p>المورد مجمع بالاسم والهاتف والرقم القومي المسجلين؛ اختلاف بياناته قد يظهر كمجموعة أخرى. الكميات تجمع كل أصنافه.</p><table><thead><tr><th>المورد</th><th>الهاتف</th><th>الفواتير</th><th>الكمية كجم</th><th>قيمة الشراء</th><th>المدفوع</th><th>غير المسدد</th></tr></thead><tbody id="supplierRows"></tbody><tfoot id="supplierTotals" class="olive-report-total"></tfoot></table></div>
</section><section id="panel-prices" role="tabpanel" aria-labelledby="tab-prices" hidden><div class="report-card"><h3>شرح اختلاف متوسط سعر الصنف</h3><label>الصنف <select id="priceVariety"></select></label><p id="priceExplanation"></p><p id="priceCount"></p><table><thead><tr><th>سعر الشراء / كجم</th><th>الكمية كجم</th><th>نسبة من كمية الصنف</th><th>قيمة الشراء</th><th>الفواتير</th><th>سطور بسعر معدل</th><th>أول / آخر عملية</th></tr></thead><tbody id="priceRows"></tbody><tfoot id="priceTotals" class="olive-report-total"></tfoot></table><p>«سعر معدل» يعني تغيير السعر عن سعر الكتالوج عند حفظ السطر، وليس دليلًا على تعديل لاحق للفاتورة. افتح السند من جدول الحركات لمراجعة المصدر.</p></div></section><section id="panel-platforms" role="tabpanel" aria-labelledby="tab-platforms" hidden><div class="report-card"><h3>المشتريات حسب منصة الشراء وجهة التسليم</h3><p>الكميات حسب فواتير الشراء، وجهة التسليم حسب المسجل بالفاتورة. قيمة الشراء لا تشمل مصاريف التجهيز والنقل أو العصر. الفواتير القديمة غير المصنفة تظهر باسم «غير محدد». استلام المعصرة الفعلي له تقرير مستقل بالبسكول.</p><table><thead><tr><th>منصة الشراء</th><th>التسليم المسجل بالفاتورة</th><th>المعصرة</th><th>الفواتير</th><th>الكمية كجم</th><th>قيمة الشراء</th><th>المدفوع</th><th>المتبقي</th></tr></thead><tbody id="platformRows"></tbody><tfoot id="platformTotals" class="olive-report-total"></tfoot></table></div></section><section id="panel-receipts" role="tabpanel" aria-labelledby="tab-receipts" hidden><div class="report-card"><h3>الحركات</h3><p>أحدث 200 سند. الملغى ظاهر للمراجعة ومستبعد من الملخص والتصدير. التصدير يشمل جميع النتائج المطابقة.</p><table class="olive-receipts-table"><thead><tr><th>رقم</th><th>التاريخ</th><th>المورد</th><th>الكمية كجم</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>الحالة</th><th>الإجراء / سبب الإلغاء</th></tr></thead><tbody id="rb"></tbody><tfoot id="receiptTotals" class="olive-report-total"></tfoot></table></div></section></div></div></template><script src="../js/api.js"></script><script src="../js/layout.js?v=20260902-customer-unified-02"></script><script src="./olive-navigation.js?v=20261013-portal1"></script><script>document.body.id='oliveOperational';document.body.classList.add('olive-operational-page');renderLayout('تحليل مشتريات الزيتون','الأصناف والموردون والأسعار والسندات بتجميعات مستقلة','olive-admin',document.getElementById('oliveAnalysisTemplate').innerHTML);</script><script>window.OLIVE_REQUIRED_PERMISSION='olive.admin';</script><script src="./access-guard.js?v=12"></script><script src="./admin.js?v=20261016-sources1"></script></body></html>
