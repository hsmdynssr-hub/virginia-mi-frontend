<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحليل موسم الزيتون</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/mi-app.css?v=20260908-project-unified-01"><style>body{background:#f6f7f3}.wrap{max-width:1100px;margin:20px auto;padding:0 12px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}.k{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.k div{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px}.k b{display:block;font-size:24px}input{padding:9px;border:1px solid #bbb;border-radius:8px}.btn{padding:9px 13px;background:#3d6b35;color:#fff;border:0;border-radius:8px;font-weight:bold}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #ddd}@media(max-width:700px){.k{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div style="display:flex;justify-content:space-between"><h1>🫒 Hub موسم الزيتون</h1><a class="btn" href="./index.html">استلام جديد</a></div><div class="card">من <input id="from" type="date"> إلى <input id="to" type="date"> <input id="q" placeholder="بحث"> <button class="btn" id="load">تحديث</button></div><div id="msg"></div><div class="k"><div>الشحنات<b id="kc">0</b></div><div>قيمة الشراء<b id="kt">0</b></div><div>المدفوع<b id="kp">0</b></div><div>المتبقي<b id="kb">0</b></div></div><div class="card"><h3>حسب الصنف</h3><table><thead><tr><th>الصنف</th><th>الوزن</th><th>القيمة</th><th>متوسط السعر</th></tr></thead><tbody id="vb"></tbody></table></div><div class="card"><h3>الحركات</h3><table><thead><tr><th>رقم</th><th>التاريخ</th><th>المورد</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th></tr></thead><tbody id="rb"></tbody></table></div></div><script src="../js/api.js"></script><script src="./admin.js?v=1"></script></body></html>
