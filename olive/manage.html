<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الزيتون المتقدمة</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/mi-app.css"><link rel="stylesheet" href="../css/report-ui.css"><link rel="stylesheet" href="../css/bootstrap-theme.css"><link rel="stylesheet" href="./olive-project.css?v=20261020-corrections1"></head><body class="cash-admin"><template id="olivePageTemplate"><div class="olive-workspace report-ui-page"><p class="pos-note">إجراءات للأدمن فقط. كل تصحيح يحفظ السبب والمنفذ والقيم قبل وبعد التعديل.</p><section class="card report-card"><h2>مراجعة حساب جلسات المحاسبين</h2><p>مراجعة الافتتاحي والدعم والمصروف والسداد النقدي والمتبقي وفروق الإقفال لكل محاسب وجلسة.</p><a class="btn" href="./cash-session-review.html" id="cashReviewReportLink">فتح تقرير حساب الجلسات</a></section><div id="advancedMessage" role="status"></div><button class="btn gray" type="button" id="advancedRetry" hidden>إعادة نفس التصحيح</button><input id="siteCode" value="MAIN" hidden><section class="card report-card" aria-label="جلسة عهدة المحاسب">
<div class="cash-row"><div><h2 style="margin-top:0">جلسة عهدة المحاسب</h2><p id="cashOwn">جارٍ تحميل الجلسة…</p></div><button type="button" class="btn gray" id="cashRefresh">تحديث الملخص</button></div>
<div id="cashMessage" role="status"></div><button type="button" class="btn gray" id="cashRetry" hidden>إعادة نفس العملية</button>
<div id="cashOpenBox" class="cash-row"><div><label for="cashOpening">الرصيد الافتتاحي النقدي</label><input id="cashOpening" type="number" min="0" step=".01" placeholder="0.00"></div><button type="button" class="btn" id="cashOpen">فتح جلسة</button></div>
<div id="cashReviewBox" style="margin-top:14px"><label for="cashChoose">مراجعة جلسة / جلسات سابقة</label><select id="cashChoose"></select></div>
<div id="cashDetails" hidden><h3 id="cashHeading"></h3><small id="cashTimes"></small><div id="cashSummary" class="cash-summary report-kpi-grid"></div><p id="cashWarning" class="cash-warning"></p><p id="cashSnapshot" class="cash-notes"></p>
<div id="cashMoveBox" hidden><h3>إضافة رصيد / دعم — للأدمن</h3><div class="grid"><div class="c3"><label for="cashKind">نوع الحركة</label><select id="cashKind"><option value="FUNDING">إضافة رصيد / دعم</option></select></div><div class="c3"><label for="cashAmount">المبلغ</label><input id="cashAmount" type="number" min=".01" step=".01"></div><div class="c6"><label for="cashReason">السبب / المنطقة / مرجع الشحنة</label><input id="cashReason" maxlength="2000"></div><div class="c3 expense-field"><label for="cashCategory">تصنيف المصروف *</label><select id="cashCategory"><option value="">اختر التصنيف</option><option value="COMMISSION">عمولة</option><option value="TRANSPORT">نقل وشحن</option><option value="LABOR">عمالة وتحميل وتعتيق</option><option value="MEALS">وجبات</option><option value="OPERATING">تشغيل وانتقالات</option><option value="EXTERNAL_PURCHASE">شراء خارجي — بانتظار ربط الفاتورة</option><option value="EXTERNAL_ADVANCE">عهدة خارجية — بانتظار التسوية</option><option value="OTHER">مصروف آخر — يحتاج مراجعة التكلفة</option></select></div><div class="c3 expense-field"><label for="cashExpenseDate">تاريخ المصروف *</label><input id="cashExpenseDate" type="date"></div><div class="c3 expense-field"><label for="cashBeneficiary">المستفيد / المورد</label><input id="cashBeneficiary" maxlength="220"></div><div class="c3 expense-field"><label for="cashReference">رقم المستند / الشحنة</label><input id="cashReference" maxlength="160"></div><div class="c12"><label for="cashFiles">المستندات المطلوبة — حتى 3 ملفات، 5MB لكل ملف، إجمالي 12MB</label><input id="cashFiles" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf"></div></div><p class="cash-notes">لصرف عهدة أو تسجيل مصروف استخدم قسم العهد والمصروفات أسفل تفاصيل الجلسة.</p><button type="button" id="cashMove" class="btn">تسجيل الحركة</button></div>
<div id="cashLedgerBox"><h3>حركات الدعم والمصروفات</h3><div style="overflow:auto"><table><thead><tr><th>الحركة</th><th>المبلغ</th><th>التصنيف والمستفيد / المستند</th><th>السبب</th><th>بواسطة / التاريخ</th><th>المرفقات</th></tr></thead><tbody id="cashMovements"></tbody></table></div></div>
<div id="cashCloseBox" hidden style="margin-top:16px"><h3>إغلاق الجلسة</h3><div class="cash-row"><div><label for="cashActual">النقدية الفعلية عند الإغلاق</label><input id="cashActual" type="number" min="0" step=".01"></div><div><label for="cashCloseNote">ملاحظة / سبب فرق النقدية</label><input id="cashCloseNote" maxlength="2000"></div><button type="button" class="btn red" id="cashClose">إغلاق الجلسة</button></div></div>
</div><details id="expenseWorkspace" class="olive-expense-workspace"><summary>العهد والمصروفات — صرف / بيان متعدد البنود / تسوية</summary>
<p class="cash-notes">صرف العهدة ينقص النقدية مرة واحدة. بيان التسوية يثبت المصروفات الفعلية دون خصم جديد، ويمكن تسجيله لاحقًا ولو أغلقت الجلسة. لا تسجل نفس المصروف كصرف مباشر وتسوية معًا.</p><div id="expenseMessage" role="status"></div><button type="button" class="btn gray" id="expenseRetry" hidden>إعادة نفس الطلب</button>
<form id="expenseEntryForm"><div class="grid"><div class="c6"><label for="expenseMode">العملية</label><select id="expenseMode"><option value="ADVANCE">صرف عهدة تحت التسوية</option><option value="DIRECT">صرف مباشر — عدة بنود</option><option value="SETTLEMENT">بيان تسوية عهدة سابقة — دون خصم جديد</option><option value="RETURN">استلام نقد مرتجع من عهدة</option></select></div><div class="c6" id="expenseAdvanceField" hidden><label for="expenseAdvance">العهدة الأصلية</label><select id="expenseAdvance"></select></div><div class="c12"><label for="expenseReason">الغرض / عنوان البيان</label><input id="expenseReason" maxlength="2000" required></div></div><p class="cash-notes" id="expenseModeNote"></p>
<div id="expenseCashFields" class="grid"><div class="c3"><label for="expenseCashAmount">المبلغ النقدي</label><input id="expenseCashAmount" type="number" min=".01" step=".01" required></div><div class="c3" id="expenseBeneficiaryField"><label for="expenseBeneficiary">مستلم العهدة</label><input id="expenseBeneficiary" maxlength="220"></div><div class="c6" id="expenseReturnSessionField" hidden><label for="expenseReturnSession">الجلسة المفتوحة المستلمة للمرتجع</label><select id="expenseReturnSession"></select></div><div class="c12"><label for="expenseCashFiles">إيصال صرف / استلام النقد — مطلوب</label><input id="expenseCashFiles" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf" required></div></div>
<div id="expenseLinesBox" hidden><p class="cash-notes">حتى 30 بندًا. لكل بند من مستند واحد إلى 3؛ 5MB لكل ملف وإجمالي مرفقات البيان 12MB. البنود المسجلة نهائية وتظهر في سجل المراجعة.</p><div style="overflow:auto"><table class="olive-expense-entry-table"><thead><tr><th>التصنيف / التاريخ</th><th>البيان / المستفيد / المرجع</th><th>المبلغ</th><th>المرفقات</th><th></th></tr></thead><tbody id="expenseEntryLines"></tbody><tfoot><tr><th colspan="2">إجمالي البيان</th><th id="expenseEntryTotal">0.00</th><th colspan="2"></th></tr></tfoot></table></div><button type="button" class="btn gray" id="expenseAddLine">+ بند مصروف</button></div><button type="submit" class="btn" id="expenseSubmit">تسجيل العملية</button></form>
<h3>العهد المصروفة وموقف التسوية</h3><button type="button" class="btn gray" id="expenseRefresh">تحديث السجل</button><div style="overflow:auto"><table><thead><tr><th>العهدة / الجلسة</th><th>المستلم / الغرض</th><th>المصروف نقدًا</th><th>مصروفات مثبتة</th><th>نقد مرتجع</th><th>تحت التسوية</th><th>المنفذ / التاريخ</th></tr></thead><tbody id="expenseAdvancesBody"></tbody><tfoot id="expenseAdvancesFoot"></tfoot></table></div><h3>بيانات المصروفات المسجلة</h3><p id="expenseStatementsCount" class="cash-notes"></p><div style="overflow:auto"><table><thead><tr><th>البيان / الجلسة</th><th>الغرض / تفاصيل البنود</th><th>المبلغ</th><th>المنفذ / التاريخ</th></tr></thead><tbody id="expenseStatementsBody"></tbody><tfoot id="expenseStatementsFoot"></tfoot></table></div></details></section>
<section class="card report-card"><h2>تعديل رصيد الجلسة المفتوحة</h2><div class="cash-row"><div><label>الافتتاحي الصحيح</label><input id="correctOpening" type="number" min="0" step=".01"></div><div><label>سبب التصحيح</label><input id="openingReason" maxlength="2000"></div><button type="button" class="btn" id="correctSession">تصحيح الافتتاحي</button></div><p class="pos-note">يعدل الجلسة المحددة أعلاه فقط. الجلسات المغلقة وملخصاتها لا تُفتح أو تُعدل.</p></section>
<section class="card report-card"><div class="pos-toolbar"><h2>مراجعة وتصحيح فاتورة</h2><div><input id="receiptId" type="number" min="1" placeholder="رقم السند" style="width:150px"> <button type="button" class="btn" id="receiptLoad">تحميل</button></div></div><div id="receiptEditor" hidden><h3 id="receiptHeading"></h3><div class="grid"><div class="c6"><label>المورد</label><input id="editSupplier"></div><div class="c3"><label>الهاتف</label><input id="editPhone"></div><div class="c3"><label>الرقم القومي</label><input id="editNational"></div><div class="c6"><label>العنوان</label><input id="editAddress"></div><div class="c3"><label>السيارة</label><input id="editVehicle"></div><div class="c12"><label>ملاحظات</label><textarea id="editNotes"></textarea></div></div><h3>الأصناف والكميات والأسعار</h3><div style="overflow:auto"><table class="receipt-lines"><thead><tr><th>الصنف</th><th>كجم</th><th>السعر / كجم</th><th></th></tr></thead><tbody id="editLines"></tbody></table></div><button type="button" class="btn gray" id="editAddLine">إضافة سطر</button><p class="pos-note">تعديل السطور يعيد حساب الإجمالي. لا يمكن جعل القيمة أقل من المدفوع أو حذف دفعات المورد.</p><label>سبب تعديل الفاتورة</label><input id="editReason" maxlength="2000"><button type="button" id="receiptEdit" class="btn">حفظ تعديل الفاتورة</button><hr><h3>تصحيح سداد سبق دفعه ولم يسجل</h3><p class="pos-note">هذا ليس أمر دفع جديدًا للمورد. يُسجل بتاريخ السند وفي جلسته الأصلية؛ السند القديم خارج الجلسات لا يخصم من عهدة اليوم.</p><div class="grid"><div class="c3"><label>المبلغ الناقص</label><input id="correctPaid" type="number" min=".01" step=".01"></div><div class="c3"><label>طريقة السداد الفعلية</label><select id="correctMethod"><option value="CASH">نقدي</option><option value="BANK_TRANSFER">تحويل</option><option value="CHEQUE">شيك</option><option value="OTHER">أخرى</option></select></div><div class="c6"><label>سبب التصحيح</label><input id="paymentReason" maxlength="2000"></div><div class="c12"><label>مستند إثبات السداد — مطلوب</label><input id="paymentFiles" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf"></div></div><button class="btn" type="button" id="paymentCorrect">تسجيل تصحيح السداد</button></div></section>
<section class="card report-card"><div class="pos-toolbar"><h2>سجل التصحيحات</h2><button class="btn gray" type="button" id="auditRefresh">تحديث</button></div><div style="overflow:auto"><table><thead><tr><th>الإجراء / الرقم</th><th>المنفذ والتاريخ</th><th>السبب</th><th>التغييرات والمستندات</th></tr></thead><tbody id="auditRows"></tbody></table></div></section></div></template><script src="../js/api.js"></script><script src="../js/layout.js?v=20261017-approved-01"></script><script src="./olive-navigation.js?v=20261013-portal1"></script><script>document.body.id="oliveOperational";document.body.classList.add("olive-operational-page");renderLayout('إدارة الزيتون والمصروفات',"شراء الزيتون ومراجعة العهدة والمستندات",'olive-advanced',document.getElementById("olivePageTemplate").innerHTML);</script><script>window.OLIVE_CASH_ADMIN=true;</script><script src="./olive-expense-entries.js?v=20261015-1"></script><script src="./olive-cash-session.js?v=20261020-corrections1"></script><script src="./manage.js?v=20261020-corrections1"></script></body></html>
