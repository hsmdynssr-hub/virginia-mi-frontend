<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مراقبة التكاليف ونقطة التعادل</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .cost-filter-panel,
    .cost-settings-panel {
      background: #fff;
      border: 1px solid #dbe5eb;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(15, 61, 67, 0.06);
    }

    .cost-filter-grid,
    .cost-settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      align-items: end;
    }

    .cost-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-weight: 700;
      color: #163b44;
    }

    .cost-field input,
    .cost-field select,
    .cost-field textarea {
      width: 100%;
      border: 1px solid #cad8df;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      color: #102f38;
    }

    .cost-field textarea {
      min-height: 42px;
      resize: vertical;
    }

    .cost-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .cost-btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 20px;
      font-weight: 800;
      cursor: pointer;
      background: #0b9bc0;
      color: #fff;
    }

    .cost-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .cost-subtitle {
      margin: 0 0 15px;
      color: #48656d;
      font-size: 14px;
    }

    .cost-warning-list {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
    }

    .cost-warning {
      background: #fff8df;
      border: 1px solid #f2d47d;
      color: #765600;
      border-radius: 12px;
      padding: 12px 15px;
      font-weight: 700;
    }

    .break-even-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .break-even-item {
      background: #f6fafb;
      border: 1px solid #d9e7eb;
      border-radius: 12px;
      padding: 14px;
    }

    .break-even-item span {
      display: block;
      color: #527079;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .break-even-item strong {
      font-size: 21px;
      color: #082f3a;
    }

    .break-even-status {
      margin-top: 14px;
      padding: 13px;
      border-radius: 12px;
      font-weight: 900;
      text-align: center;
    }

    .break-even-status.above_break_even {
      color: #0a6b3d;
      background: #e8f8ef;
      border: 1px solid #9edbb9;
    }

    .break-even-status.below_break_even,
    .break-even-status.invalid_margin {
      color: #9c2f24;
      background: #fff0ee;
      border: 1px solid #efb4ad;
    }

    .break-even-status.not_configured {
      color: #745800;
      background: #fff8df;
      border: 1px solid #efd680;
    }

    .cost-comparison-positive {
      color: #087a47;
      font-weight: 800;
    }

    .cost-comparison-negative {
      color: #b23a2c;
      font-weight: 800;
    }

    .cost-section-tabs {
      display: flex;
      gap: 8px;
      margin: 15px 0;
      flex-wrap: wrap;
    }

    .cost-tab-btn {
      border: 1px solid #c7d7de;
      background: #fff;
      color: #16434d;
      border-radius: 10px;
      padding: 9px 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .cost-tab-btn.active {
      color: #fff;
      background: #0f5163;
      border-color: #0f5163;
    }

    .cost-tab-panel[hidden] {
      display: none !important;
    }

    .settings-note {
      font-size: 13px;
      color: #5c747b;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="./index.js?v=20260728-1"></script>
</body>
</html>
