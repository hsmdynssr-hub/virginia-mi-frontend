<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><meta name="theme-color" content="#64449c"><meta name="referrer" content="no-referrer"><title>Virginia Workspace</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="discuss.css"></head><body>
<header class="topbar"><button id="toggleChannels" class="icon-button" aria-expanded="false" aria-controls="channelSidebar" data-i18n-aria="channels">☰</button><a class="brand" href="./"><span class="brand-icon" aria-hidden="true">V</span><span>Virginia <b>Workspace</b></span></a><span class="top-spacer"></span><button id="install" hidden data-i18n="install"></button><button id="language" type="button">English</button><button id="bell" class="icon-button" aria-expanded="false" aria-controls="notificationsPanel" data-i18n-aria="notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span id="unreadCount" class="badge" hidden></span></button><span id="identity" dir="ltr"></span><button id="logout" hidden data-i18n="logout"></button></header>
<p id="status" class="status" role="status" aria-live="polite"></p>
<section id="loginSection" class="login-card"><span class="eyebrow">VIRGINIA WORKSPACE</span><h1 data-i18n="welcome"></h1><p data-i18n="loginIntro"></p><form id="login"><label for="employee" data-i18n="employeeLogin"></label><input id="employee" inputmode="numeric" required autocomplete="username"><label for="password" data-i18n="password"></label><input id="password" type="password" required autocomplete="current-password"><button class="primary" data-i18n="login"></button></form><p id="installHelp" class="muted" data-i18n="installHelp"></p></section>
<main id="workspace" class="workspace" hidden>
<aside id="channelSidebar" class="channel-sidebar"><div class="sidebar-heading"><span class="eyebrow" data-i18n="officialSpace"></span><h2 data-i18n="channels"></h2><button id="closeChannels" class="icon-button" data-i18n-aria="close">×</button></div><label class="sr-only" for="channel" data-i18n="channels"></label><select id="channel" class="sr-only"></select><nav id="channelList" data-i18n-aria="channels"></nav><div class="sidebar-footer"><span class="security-dot"></span><span data-i18n="officialOnly"></span></div></aside>
<aside class="topic-sidebar"><div class="topic-list-heading"><div><span id="channelCaption" class="eyebrow"></span><h2 data-i18n="topics"></h2></div><button id="newTopic" class="primary small" hidden data-i18n="newTopic"></button></div><label class="sr-only" for="topicSelect" data-i18n="topics"></label><select id="topicSelect" class="sr-only"></select><nav id="topicList" data-i18n-aria="topics"></nav><button id="moreTopics" class="text-button" hidden data-i18n="olderTopics"></button></aside>
<section class="conversation"><div class="conversation-heading"><div class="heading-copy"><span id="channelTitle" class="eyebrow"></span><h1 id="topicName"></h1><span id="topicState" class="pill" role="status"></span><span id="topicReference" hidden></span></div><button id="refresh" class="icon-button" data-i18n-aria="refresh">↻</button><button id="advanceTopic" class="text-button" hidden></button><button id="closeTopic" class="text-button" hidden data-i18n="closeDiscussion"></button></div>
<section id="topicPanel" class="topic-details" hidden><p id="topicDescriptionView" class="body"></p><form id="topicForm" class="editor-card" hidden><h2 data-i18n="newTopic"></h2><label for="topicTitle" data-i18n="title"></label><input id="topicTitle" maxlength="200" required><label for="topicDescription" data-i18n="description"></label><textarea id="topicDescription" maxlength="5000"></textarea><label for="topicMention" data-i18n="mentionPeople"></label><select id="topicMention" multiple size="3"></select><div class="form-actions"><button class="primary" data-i18n="createTopic"></button><button type="button" id="cancelTopic" data-i18n="cancel"></button></div></form>
<form id="decisionForm" class="editor-card" hidden><h2 data-i18n="closeDiscussion"></h2><p class="notice" data-i18n="localClosure"></p><label for="decisionSummary" data-i18n="decisionSummary"></label><textarea id="decisionSummary" maxlength="10000" required></textarea><label for="followUp" data-i18n="followUp"></label><select id="followUp" required></select><div class="form-actions"><button class="primary" data-i18n="saveDecision"></button><button type="button" id="cancelDecision" data-i18n="cancel"></button></div></form><p id="decisionView" class="decision-card" hidden></p></section>
<div class="message-history"><button id="older" class="history-button" hidden data-i18n="olderMessages"></button><section id="messages" class="messages" aria-live="polite" aria-relevant="additions"></section></div>
<form id="compose" class="composer"><label class="sr-only" for="body" data-i18n="message"></label><div id="mentionResults" class="mention-results"></div><textarea id="body" maxlength="10000" required rows="2" data-i18n-placeholder="messagePlaceholder"></textarea><p id="selectedMentions"></p><div class="composer-toolbar"><button id="clearMentions" class="text-button" type="button" data-i18n="clearMentions"></button><span class="attachment-policy" data-i18n="attachmentsDisabled"></span><input id="attachmentFile" hidden disabled type="file"><button id="send" class="primary" data-i18n="send"></button></div></form><div class="conversation-footer" data-i18n="workspaceSaved"></div>
<section id="attachmentsPanel" hidden><div id="attachments"></div><button id="refreshAttachments" type="button" data-i18n="refresh"></button><button id="moreAttachments" type="button" hidden data-i18n="loadMore"></button></section></section></main>
<section id="notificationsPanel" class="notification-popover" role="region" data-i18n-aria="notifications" hidden><div class="popover-heading"><h2 data-i18n="notifications"></h2><button id="refreshNotifications" type="button" data-i18n="refresh"></button><button id="closeNotifications" class="icon-button" data-i18n-aria="close">×</button></div><p id="notificationSummary" class="muted" role="status"></p><div id="notifications"></div><button id="olderNotifications" type="button" hidden data-i18n="olderNotifications"></button></section><button id="sidebarBackdrop" class="sidebar-backdrop" data-i18n-aria="close" hidden></button>
<script src="config.js"></script><script src="locales/ar.js"></script><script src="locales/en.js"></script><script src="i18n.js"></script><script src="pagination.js"></script><script src="app.js"></script><script src="collaboration.js"></script><script src="shell.js"></script></body></html>
