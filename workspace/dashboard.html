<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virginia Workspace Administration</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/mi-app.css"><link rel="stylesheet" href="dashboard.css"></head><body>
<template id="workspace-dashboard-template"><main id="ws-admin">
<header class="wa-hero"><div><small>Virginia Workspace</small><h2 data-t="title"></h2><p data-t="scope"></p></div><button id="wa-language" type="button">English</button><a href="./" data-t="pwa"></a></header>
<nav id="wa-tabs" aria-label="Workspace"></nav><p id="wa-status" role="status"></p>
<section data-panel="employees"><h3 data-t="employees"></h3><form id="wa-search"><label><span data-t="search"></span><input id="wa-query" type="search" required minlength="1" maxlength="100"></label><button data-t="searchButton"></button></form><p data-t="searchNote"></p><div id="wa-results"></div><button id="wa-search-more" hidden data-t="more"></button>
<form id="wa-approve" hidden><h4 data-t="review"></h4><p id="wa-evidence"></p><label><span data-t="englishName"></span><input id="wa-english" required maxlength="200" dir="ltr"></label><label><span data-t="roles"></span><select id="wa-roles" multiple></select></label><label><span data-t="odooUser"></span><input id="wa-user" inputmode="numeric"></label><label><input type="checkbox" id="wa-user-confirm"><span data-t="confirmMapping"></span></label><label><input id="wa-confirm" type="checkbox" required><span data-t="confirmIdentity"></span></label><button data-t="approve"></button></form><div id="wa-employees"></div><button id="wa-employees-more" hidden data-t="more"></button></section>
<section data-panel="channels" hidden><h3 data-t="channels"></h3><form id="wa-create-channel"><label><span data-t="channelName"></span><input id="wa-channel-name" required maxlength="200"></label><button data-t="createChannel"></button></form><p data-t="officialOnly"></p><div id="wa-channels"></div><button id="wa-channels-more" hidden data-t="more"></button></section>
<section data-panel="permissions" hidden><h3 data-t="permissions"></h3><p data-t="permissionNote"></p><label><span data-t="account"></span><select id="wa-account"></select></label><button id="wa-account-more" hidden data-t="moreAccounts"></button><div class="wa-actions"><button id="wa-invite" data-t="invite"></button><button id="wa-disable" data-t="disable"></button></div><label><span data-t="activationLink"></span><input id="wa-invite-url" readonly dir="ltr" autocomplete="off"></label><div id="wa-grants"></div><button id="wa-save-grants" data-t="save"></button></section>
<section data-panel="discussions" hidden><h3 data-t="discussions"></h3><p data-t="localDecision"></p><div id="wa-discussions"></div><button id="wa-discussions-more" hidden data-t="more"></button></section>
<section data-panel="notifications" hidden><h3 data-t="notifications"></h3><p data-t="notificationsNote"></p><div id="wa-notifications"></div><button id="wa-notifications-more" hidden data-t="more"></button></section>
<section data-panel="audit" hidden><h3 data-t="audit"></h3><div id="wa-audit"></div><button id="wa-audit-more" hidden data-t="more"></button><h4 data-t="decisions"></h4><div id="wa-decisions"></div><button id="wa-decisions-more" hidden data-t="more"></button></section>
</main></template>
<script src="../js/api.js"></script><script src="../js/layout.js"></script><script src="config.js"></script><script src="admin-locales.js"></script><script src="dashboard.js"></script>
</body></html>
