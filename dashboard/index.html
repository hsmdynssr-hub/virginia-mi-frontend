    .ops-overview {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(280px, .65fr);
      gap: 16px;
    }

    .ops-welcome,
    .ops-status-panel {

      justify-content: center;
      padding: 30px 32px;
      border: 1px solid #dfe7f4;
      background:

        linear-gradient(135deg, #ffffff 0%, #f7faff 58%, #edf5ff 100%);
    }

    .ops-welcome::after {
      content: "";
      position: absolute;
      inset-inline-end: -55px;
      bottom: -105px;
      width: 245px;
      height: 245px;
      border: 38px solid rgba(37, 87, 214, .055);
      border-radius: 50%;
      pointer-events: none;
    }

    .ops-eyebrow,
    .ops-status-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      gap: 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .ops-eyebrow {
      padding: 7px 10px;
      color: #1f55c7;
      border: 1px solid #d7e4ff;
      background: #f1f6ff;
    }

    .ops-eyebrow::before,
    .ops-status-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2fb887;
      box-shadow: 0 0 0 4px rgba(47, 184, 135, .11);
    }

    .ops-welcome h2 {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 14px 0 8px;
      color: #101c34;
      font-size: clamp(25px, 3vw, 36px);
      line-height: 1.35;
      letter-spacing: -.035em;
    }

    .ops-welcome p {
      position: relative;
      z-index: 1;
      max-width: 700px;
      margin: 0;
      color: #64728a;
      font-size: 12px;
      line-height: 1.9;
    }

    .ops-actions {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 20px;
    }

    .ops-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 15px;
      border-radius: 11px;
      text-decoration: none;
      font-size: 10px;
      font-weight: 800;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .ops-action:hover { transform: translateY(-2px); }
    .ops-action.primary { color: #fff; background: linear-gradient(135deg, #1c4bc0, #2865e5); box-shadow: 0 10px 20px rgba(37, 87, 214, .19); }
    .ops-action.secondary { color: #1c2942; border: 1px solid #dce4f0; background: rgba(255, 255, 255, .86); }

    .ops-status-panel {
      display: flex;
      flex-direction: column;
      padding: 24px;
      color: #fff;
      background:
        radial-gradient(circle at 0 100%, rgba(21, 173, 163, .28), transparent 18rem),
        linear-gradient(145deg, #12233f 0%, #0c182c 100%);
    }

    .ops-status-panel::after {
      content: "";
      position: absolute;
      inset-inline-end: -62px;
      top: -70px;
      width: 190px;
      height: 190px;
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 50%;
      box-shadow: 0 0 0 34px rgba(255, 255, 255, .018);
    }

    .ops-status-badge {
      position: relative;
      z-index: 1;
      padding: 6px 9px;
      color: #bcd1f1;
      border: 1px solid rgba(255, 255, 255, .1);
      background: rgba(255, 255, 255, .05);
    }

    .ops-status-panel h3 { position: relative; z-index: 1; margin: 15px 0 5px; color: #fff; font-size: 17px; }
    .ops-status-panel > p { position: relative; z-index: 1; margin: 0; color: #8fa2bf; font-size: 10px; line-height: 1.7; }

    .ops-status-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin-top: auto;
      padding-top: 20px;
    }

    .ops-stat {
      padding: 13px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 13px;
      background: rgba(255, 255, 255, .045);
    }

    .ops-stat strong { display: block; color: #fff; font-size: 22px; line-height: 1; }

    .dashboard-section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding: 0 3px;

    .dashboard-modules-grid {

      gap: 15px;

    .dashboard-card h3 { margin: 0 0 4px; color: #142039; font-size: 16px; }
    .dashboard-card-title small { color: #8a97aa; font-size: 8px; font-weight: 700; }

    .dashboard-badge {

</head>

    function getAllowedReports(module) {
      return module.reports.filter((report) => {
        if (report.disabled) return hasPermission(report.page);
        return hasPermission(report.page);
      });
    }

    function countAllowedReports(modules) {
      return modules.reduce((total, module) => {
        const includesIndex = module.allowedReports.some(report => report.page === module.indexPage);
        return total + module.allowedReports.length + (module.indexAllowed && !includesIndex ? 1 : 0);
      }, 0);
    }

    function getModuleAccessCount(module) {
      const includesIndex = module.allowedReports.some(report => report.page === module.indexPage);
      return module.allowedReports.length + (module.indexAllowed && !includesIndex ? 1 : 0);
    }

    function buildReportLinks(reports) {
      if (!reports.length) {
        return "";
      }

      return `
        <div class="dashboard-report-links">
          ${reports.map((report) => {
            if (report.disabled) {
              return `
                <div class="disabled-report" title="الصفحة غير موجودة بعد">
                  ${report.title}
                </div>
              `;
            }

            return `
              <a href="${report.href}">
                ${report.title}
              </a>
            `;
          }).join("")}
        </div>
      `;
    }

    function buildDashboardModules() {

        .map((module) => {

          return {
            ...module,
            allowedReports,
            indexAllowed
          };
        })
        .filter((module) => module.indexAllowed || module.allowedReports.length > 0);

      if (!allowedModules.length) {
        return {
          html: `
            <div class="permission-denied-card">
              <div class="permission-orbit">
                <div class="permission-icon">🔒📊</div>
              </div>

              <span class="permission-badge">No Reports</span>

              <h2>لا توجد تقارير متاحة لحسابك</h2>

              <p>
                حسابك لا يملك صلاحية عرض أي تقرير حاليًا.
                تواصل مع مسؤول النظام لإضافة الصلاحيات المناسبة.
              </p>
            </div>
          `,
          modulesCount: 0,
          reportsCount: 0
        };
      }

      return {
        html: `
          <div class="dashboard-section-title">
            <div>
              <h3>مساحات العمل الأساسية</h3>
              <p>انتقل مباشرة إلى القسم أو اختر إحدى الوظائف السريعة.</p>
            </div>
            <span class="dashboard-section-count"><strong>${allowedModules.length}</strong><span>مساحات عمل متاحة</span></span>
          </div>

          <div class="dashboard-modules-grid">
            ${allowedModules.map((module, index) => {
              const tones = ["tone-blue", "tone-teal", "tone-amber", "tone-violet"];
              return `
                <article class="dashboard-card ${tones[index % tones.length]}">
                  <div class="dashboard-card-top">
                    <div class="dashboard-card-title">
                      <div class="dashboard-icon">${module.icon}</div>
                      <div>
                        <h3>${module.title}</h3>
                        <small>مساحة تشغيل متخصصة</small>
                      </div>
                    </div>
                    <div class="dashboard-badge">
                      <strong>${getModuleAccessCount(module)}</strong><span>وظائف</span>
                    </div>
                  </div>

                  <p>${module.description}</p>

                  <div class="dashboard-card-actions">
                    <span class="dashboard-links-label">اختصارات سريعة</span>
                    ${module.indexAllowed ? `
                      <a class="dashboard-module-main-link" href="${module.indexHref}">
                        فتح القسم
                      </a>
                    ` : ""}
                  </div>

                  ${buildReportLinks(module.allowedReports)}
                </article>
              `;
            }).join("")}
          </div>
        `,
        modulesCount: allowedModules.length,
        reportsCount: countAllowedReports(allowedModules)
      };
    }

    const dashboard = buildDashboardModules();

    renderLayout(
      "Virginia Operations Hub",
      "الفروع والمينو والمبيعات وخدمة العملاء في واجهة تشغيل واحدة",
      "dashboard",
      `
        <div class="dashboard-home-shell">
          <section class="ops-overview">
            <div class="ops-welcome">
              <span class="ops-eyebrow">منصة التشغيل اليومية</span>
              <h2>كل ما تحتاجه لإدارة المبيعات وتجربة العميل في مكان واحد</h2>
              <p>
                ابدأ باختيار الشركة من أعلى الصفحة، ثم انتقل إلى الفروع أو المينو أو المبيعات أو رسائل خدمة العملاء مباشرة.
              </p>

              <div class="ops-actions">
                <a class="ops-action primary" href="../customer/review-sms-queue.html"><span aria-hidden="true">💬</span><span>تشغيل رسائل العملاء</span></a>
                <a class="ops-action secondary" href="../menu/prices.html"><span aria-hidden="true">🧾</span><span>فتح المينو والأسعار</span></a>
              </div>
            </div>

            <aside class="ops-status-panel">
              <span class="ops-status-badge">Odoo Enterprise 18</span>
              <h3>مركز عمليات فيرجينيا</h3>
              <p>واجهة واحدة للفروع والمبيعات وخدمة العملاء.</p>

              <div class="ops-status-grid">
                <div class="ops-stat">
                  <span>مساحات العمل</span>
                  <strong>${dashboard.modulesCount}</strong>
                </div>
                <div class="ops-stat">
                  <span>الوظائف المتاحة</span>
                  <strong>${dashboard.reportsCount}</strong>
                </div>
              </div>
            </aside>
          </section>

          ${dashboard.html}
        </div>
      `
    );
  </script>
</body>
</html>
