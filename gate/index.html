<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>بوابة الشركة</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/notifications.js?v=20260901-global-01"></script>
  <link rel="stylesheet" href="../css/mi-app.css?v=20260908-project-unified-01" data-mi-unified-ui="true">
</head>
<body>
<script src="../js/api.js"></script>
<script src="../js/layout.js?v=20261010-gate-module-v192"></script>
<script>
  const gateCards = [
    {
      permission: "gate.access",
      href: "./operations.html",
      pill: "تشغيل",
      title: "تشغيل البوابة",
      text: "تسجيل التوريدات والشحن والزيارات والصيانة والعينات ومتابعة الموجودين داخل الشركة."
    },
    {
      permission: "gate.admin",
      href: "./control.html",
      pill: "متابعة",
      title: "متابعة حركة البوابة",
      text: "سجل الحركة الكامل، السيارات الموجودة حاليًا، والربط اليدوي للحركات مع Odoo."
    },
    {
      permission: "sample.receive",
      href: "./sample-receive.html",
      pill: "المخزن",
      title: "استلام العينات بالمخزن",
      text: "استلام العينات باستخدام كود العينة فقط دون إظهار بيانات المورد الأصلي."
    },
    {
      permission: "sample.admin",
      href: "./samples-admin.html",
      pill: "إدارة",
      title: "إدارة العينات وربط Odoo",
      text: "متابعة دورة حياة العينات وربطها بإيصالات Odoo الحرة أو المرتبطة بأوامر شراء."
    }
  ];

  const visibleGateCards = gateCards.filter(card =>
    isAdmin() || getUserPermissions().includes(card.permission)
  );

  renderLayout(
    "بوابة الشركة",
    "مركز تشغيل موحد لحركة البوابة والعينات",
    "gate",
    `
      <div class="reports-grid">
        ${visibleGateCards.map(card => `
          <a class="report-card" href="${card.href}">
            <span class="page-pill">${card.pill}</span>
            <h3>${card.title}</h3>
            <p>${card.text}</p>
          </a>
        `).join("") || `
          <section class="permission-denied-card">
            <h3>لا توجد وظائف متاحة لك داخل بوابة الشركة</h3>
            <p>راجع صلاحيات المستخدم مع مدير النظام.</p>
          </section>
        `}
      </div>
    `
  );
</script>
</body>
</html>
