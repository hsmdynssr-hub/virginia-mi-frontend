<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إدارة العينات وربط Odoo</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/mi-app.css?v=20260908-project-unified-01" data-mi-unified-ui="true">
  <style>
    .samples-admin{max-width:1500px;margin:auto}
    .samples-panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-top:12px}
    .samples-tools{display:flex;gap:8px;flex-wrap:wrap}
    .samples-admin input,.samples-admin select{padding:10px;border:1px solid #d8dde6;border-radius:10px}
    .samples-admin button{border:0;border-radius:10px;padding:10px 13px;background:#1f2937;color:#fff;cursor:pointer}
    .samples-admin button.ok{background:#166534}
    .samples-admin table{width:100%;border-collapse:collapse;font-size:13px}
    .samples-admin th,.samples-admin td{padding:9px;border-bottom:1px solid #edf0f4;text-align:right;vertical-align:top}
    .samples-admin th{background:#f9fafb}
    .samples-scroll{overflow:auto;max-height:650px}
    .sync{display:flex;gap:6px;min-width:330px}
    .sync input{min-width:210px}
  </style>
</head>
<body>
<script src="../js/api.js"></script>
<script src="../js/layout.js?v=20261010-gate-module-v192"></script>
<script>
  renderLayout(
    "إدارة العينات وربط Odoo",
    "متابعة دورة حياة العينات والربط مع إيصالات Odoo",
    "gate-samples-admin",
    `
      <div class="samples-admin">
        <div class="samples-tools">
          <select id="companyId">
            <option value="1">Virginia</option>
            <option value="2">Cleopatra</option>
          </select>
          <select id="status">
            <option value="">كل الحالات</option>
            <option value="REGISTERED_AT_GATE">مسجلة بالبوابة</option>
            <option value="HANDED_TO_WAREHOUSE">تم تسليمها للمخزن</option>
            <option value="WAITING_ODOO_RECEIPT">بانتظار إيصال Odoo</option>
            <option value="ODOO_LINKED">مرتبطة بـ Odoo</option>
          </select>
          <input id="dateFrom" type="date">
          <input id="dateTo" type="date">
          <button id="loadBtn">تحديث</button>
        </div>

        <section class="samples-panel">
          <div class="samples-scroll">
            <table>
              <thead><tr>
                <th>كود العينة</th><th>المورد الأصلي</th><th>وصف العينة</th>
                <th>العبوات</th><th>أمر الشراء</th><th>الحالة</th><th>Odoo</th>
              </tr></thead>
              <tbody id="body"></tbody>
            </table>
          </div>
        </section>
      </div>
    `
  );
</script>
<script src="./samples-admin.js?v=20261010-v192"></script>
</body>
</html>
