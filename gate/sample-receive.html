<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>استلام العينات</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/mi-app.css?v=20261010-sample-v19">
  <style>
    body{background:#f7f8fa}
    .wrap{max-width:900px;margin:auto;padding:20px}
    .panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-top:12px}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    input,select,textarea{padding:11px;border:1px solid #d8dde6;border-radius:10px;background:#fff}
    input{flex:1;min-width:240px}
    button{border:0;border-radius:10px;padding:11px 16px;background:#1f2937;color:#fff;cursor:pointer}
    button.ok{background:#166534}
    .code{font-size:30px;font-weight:800;letter-spacing:1px}
    .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .box{background:#f9fafb;padding:12px;border-radius:10px}
    @media(max-width:700px){.meta{grid-template-columns:1fr}}
  </style>
</head>
<body>
<script src="../js/api.js"></script>

<div class="wrap">
  <h1>استلام العينات بالمخزن</h1>
  <p>استلم العينة باستخدام الكود فقط. بيانات المورد الأصلي لا تظهر في هذه الصفحة.</p>

  <section class="panel">
    <div class="row">
      <select id="companyId">
        <option value="1">Virginia</option>
        <option value="2">Cleopatra</option>
      </select>
      <input id="sampleCode" autofocus placeholder="امسح أو اكتب كود العينة SMP-...">
      <button id="lookupBtn">بحث</button>
    </div>
  </section>

  <section class="panel" id="resultPanel" style="display:none">
    <div class="code" id="codeOut"></div>

    <div class="meta">
      <div class="box"><b>وصف العينة</b><div id="descOut"></div></div>
      <div class="box"><b>عدد العبوات</b><div id="countOut"></div></div>
      <div class="box"><b>وقت الوصول للبوابة</b><div id="gateTimeOut"></div></div>
      <div class="box"><b>أمر شراء إن وجد</b><div id="poOut"></div></div>
    </div>

    <div style="margin-top:12px">
      <input id="receiverName" style="width:100%;box-sizing:border-box;margin-bottom:8px" placeholder="اسم مستلم العينة بالمخزن">
      <textarea id="receiveNotes" rows="3" style="width:100%;box-sizing:border-box" placeholder="ملاحظات الاستلام"></textarea>
    </div>

    <button id="receiveBtn" type="button" class="ok" style="margin-top:10px">
      تم استلام العينة بالمخزن
    </button>

    <div id="receiveMessage" style="margin-top:10px;font-weight:700"></div>
  </section>
</div>

<script src="./sample-receive.js?v=20261010-v19"></script>
</body>
</html>
